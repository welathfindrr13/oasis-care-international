name: Deploy Oasis Care to Staging

on:
  workflow_dispatch:
    inputs:
      cognito_client_secret:
        description: 'Cognito Client Secret (leave blank to auto-generate if needed)'
        required: false
        type: string
      nextauth_secret:
        description: 'NextAuth Secret (leave blank to auto-generate)'
        required: false  
        type: string
      route53_zone_id:
        description: 'Route53 Zone ID (leave blank to auto-detect)'
        required: false
        type: string
      admin_email:
        description: 'Admin user email for demo'
        required: false
        default: 'boss@oasis-care.co'
        type: string
      carer_email:
        description: 'Carer demo email'
        required: false
        default: 'carer-demo@oasis-care.co'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  PROJECT_NAME: oasis-care
  ENVIRONMENT: staging
  
jobs:
  tf-preflight:
    name: Terraform Backend Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        ref: feat/staging-live-setup
        
    - name: 🔑 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: 🪣 Setup Terraform Backend
      run: |
        echo "🪣 Setting up S3 backend for Terraform state"
        
        BUCKET_NAME="oasis-terraform-state-eu-west-2"
        TABLE_NAME="oasis-terraform-locks"
        
        # Create S3 bucket if it doesn't exist
        if ! aws s3 ls "s3://$BUCKET_NAME" 2>/dev/null; then
          echo "Creating S3 bucket: $BUCKET_NAME"
          aws s3api create-bucket \
            --bucket "$BUCKET_NAME" \
            --region eu-west-2 \
            --create-bucket-configuration LocationConstraint=eu-west-2
          
          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled
          
          # Enable encryption
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                }
              }]
            }'
          
          # Block public access
          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          
          echo "✅ S3 bucket created and configured"
        else
          echo "✅ S3 bucket already exists"
        fi
        
        # Create DynamoDB table if it doesn't exist
        if ! aws dynamodb describe-table --table-name "$TABLE_NAME" --region eu-west-2 2>/dev/null; then
          echo "Creating DynamoDB table: $TABLE_NAME"
          aws dynamodb create-table \
            --table-name "$TABLE_NAME" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region eu-west-2 \
            --tags Key=Environment,Value=staging Key=Project,Value=oasis-care
          
          echo "⏳ Waiting for table to be active..."
          aws dynamodb wait table-exists --table-name "$TABLE_NAME" --region eu-west-2
          echo "✅ DynamoDB table created"
        else
          echo "✅ DynamoDB table already exists"
        fi
        
        echo "✅ Terraform backend infrastructure ready"
  
  deploy:
    name: Deploy Infrastructure & Applications
    needs: tf-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: 🚀 Starting Oasis Care Staging Deployment
      run: |
        echo "🏥 OASIS CARE - STAGING DEPLOYMENT STARTING"
        echo "Target domains: app.oasis-care.co, api.oasis-care.co"
        echo "AWS Region: ${{ env.AWS_REGION }}"
        echo "Time: $(date)"

    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        ref: feat/staging-live-setup

    - name: 🔑 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: ✅ Verify AWS Connection
      run: |
        echo "🔍 Verifying AWS connection..."
        aws sts get-caller-identity
        echo "AWS connection verified!"

    - name: 🏗️ Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.6

    - name: 📋 Phase 0 - Pre-flight Setup
      run: |
        echo "🏁 Phase 0: Pre-flight checks"
        
        # Determine Route53 zone ID (with fallback to known value)
        if [ -n "${{ inputs.route53_zone_id }}" ]; then
          ZONE_ID="${{ inputs.route53_zone_id }}"
          echo "Using provided Route53 zone ID: $ZONE_ID"
        else
          echo "Auto-detecting Route53 zone ID for oasis-care.co..."
          ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name oasis-care.co --query "HostedZones[0].Id" --output text 2>/dev/null | sed 's|/hostedzone/||' || echo "")
          
          # Fallback to known zone ID if auto-detection fails
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "None" ]; then
            echo "⚠️ Auto-detection failed, using known zone ID"
            ZONE_ID="Z00092362ORF3ZO6TWKKZ"
          fi
          
          echo "Route53 zone ID: $ZONE_ID"
        fi
        
        # Validate zone ID is set
        if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "None" ]; then
          echo "❌ Failed to determine Route53 zone ID"
          exit 1
        fi
        
        echo "ROUTE53_ZONE_ID=$ZONE_ID" >> $GITHUB_ENV
        echo "✅ Route53 zone ID configured: $ZONE_ID"

    - name: 🔐 Phase 1 - Cognito Client Secret
      run: |
        echo "🔐 Phase 1: Cognito Confidential Client Configuration"
        
        # Get AWS Account ID for ARN construction
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "AWS Account: $AWS_ACCOUNT_ID"
        
        # Check if confidential client already exists
        NEW_CLIENT_NAME="oasis-staging-web-confidential"
        echo "Checking for existing confidential client: $NEW_CLIENT_NAME"
        
        EXISTING_CLIENT=$(aws cognito-idp list-user-pool-clients \
          --user-pool-id eu-west-2_YPo6sl1zm \
          --query "UserPoolClients[?ClientName=='${NEW_CLIENT_NAME}'].ClientId" \
          --output text 2>/dev/null || echo "")
        
        if [ -z "$EXISTING_CLIENT" ]; then
          echo "Creating new confidential Cognito client with GenerateSecret=true..."
          
          CLIENT_RESPONSE=$(aws cognito-idp create-user-pool-client \
            --user-pool-id eu-west-2_YPo6sl1zm \
            --client-name "$NEW_CLIENT_NAME" \
            --generate-secret \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes email openid profile \
            --allowed-o-auth-flows-user-pool-client \
            --callback-urls "https://app.oasis-care.co/api/auth/callback/cognito" \
            --logout-urls "https://app.oasis-care.co" \
            --supported-identity-providers COGNITO \
            --output json)
          
          NEW_CLIENT_ID=$(echo "$CLIENT_RESPONSE" | jq -r '.UserPoolClient.ClientId')
          CLIENT_SECRET=$(echo "$CLIENT_RESPONSE" | jq -r '.UserPoolClient.ClientSecret')
          
          echo "✅ Created new confidential client: $NEW_CLIENT_ID"
        else
          echo "Using existing confidential client: $EXISTING_CLIENT"
          NEW_CLIENT_ID="$EXISTING_CLIENT"
          
          # Retrieve existing secret
          CLIENT_SECRET=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id eu-west-2_YPo6sl1zm \
            --client-id "$NEW_CLIENT_ID" \
            --query "UserPoolClient.ClientSecret" --output text)
          
          echo "✅ Retrieved existing client secret"
        fi
        
        # Persist secret to Secrets Manager (idempotent)
        echo "Persisting Cognito client secret to Secrets Manager..."
        aws secretsmanager create-secret \
          --name oasis/staging/cognito_web_client_secret \
          --secret-string "$CLIENT_SECRET" \
          --description "Cognito confidential client secret for Oasis staging web app" \
          2>/dev/null || \
        aws secretsmanager put-secret-value \
          --secret-id oasis/staging/cognito_web_client_secret \
          --secret-string "$CLIENT_SECRET"
        
        # Export ARN and client ID (NOT the raw secret)
        SECRET_ARN="arn:aws:secretsmanager:eu-west-2:${AWS_ACCOUNT_ID}:secret:oasis/staging/cognito_web_client_secret"
        
        echo "COGNITO_CLIENT_ID=$NEW_CLIENT_ID" >> $GITHUB_ENV
        echo "COGNITO_CLIENT_SECRET_ARN=$SECRET_ARN" >> $GITHUB_ENV
        echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV
        
        echo "✅ Cognito confidential client configured with real secret"
        echo "   Client ID: $NEW_CLIENT_ID"
        echo "   Secret ARN: $SECRET_ARN"

    - name: 🗄️ Phase 2 - RDS Setup  
      run: |
        echo "🗄️ Phase 2: RDS password and endpoint setup"
        
        # Determine actual RDS identifier
        RDS_ID=""
        for candidate in "oasis-staging" "oasis-care-staging-db"; do
          if aws rds describe-db-instances --db-instance-identifier "$candidate" >/dev/null 2>&1; then
            RDS_ID="$candidate"
            break
          fi
        done
        
        if [ -z "$RDS_ID" ]; then
          echo "❌ No RDS instance found. Please ensure RDS is created first."
          exit 1
        fi
        
        echo "📊 Using RDS instance: $RDS_ID"
        
        # Get RDS endpoint
        RDS_ENDPOINT=$(aws rds describe-db-instances \
          --db-instance-identifier "$RDS_ID" \
          --query "DBInstances[0].Endpoint.Address" --output text)
        
        # Generate RDS-compliant password (hex only: 0-9, a-f - no forbidden chars)
        echo "🔄 Generating RDS-compliant master password..."
        set +x
        NEW_PASSWORD="$(openssl rand -hex 32)"
        echo "::add-mask::$NEW_PASSWORD"
        set -x
        
        # Reset master password
        echo "🔄 Resetting RDS master password..."
        aws rds modify-db-instance \
          --db-instance-identifier "$RDS_ID" \
          --master-user-password "$NEW_PASSWORD" \
          --apply-immediately
        
        # Wait for available state
        echo "⏳ Waiting for RDS to become available..."
        aws rds wait db-instance-available --db-instance-identifier "$RDS_ID"
        
        # Build DATABASE_URL (URL encode password)
        set +x
        ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$NEW_PASSWORD'))")
        DATABASE_URL="postgresql://oasis:$ENCODED_PASSWORD@$RDS_ENDPOINT:5432/oasis"
        echo "::add-mask::$DATABASE_URL"
        set -x
        
        echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV
        echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
        echo "✅ RDS configured - endpoint: $RDS_ENDPOINT"

    - name: 🔍 Phase 2.5 - Secrets Manager Preflight Check
      run: |
        set -euo pipefail
        echo "🔍 Phase 2.5: Verifying Secrets Manager write permissions..."
        
        # Create a temporary secret to test full CRUD permissions
        TMP="oasis/staging/preflight-$(date +%s)"
        echo "Testing CRUD on temporary secret: $TMP"
        
        aws secretsmanager create-secret \
          --name "$TMP" \
          --secret-string "preflight-test" \
          --tags Key=env,Value=staging >/dev/null
        echo "  ✓ CreateSecret"
        
        aws secretsmanager put-secret-value \
          --secret-id "$TMP" \
          --secret-string "preflight-test-updated" >/dev/null
        echo "  ✓ PutSecretValue"
        
        aws secretsmanager describe-secret \
          --secret-id "$TMP" >/dev/null
        echo "  ✓ DescribeSecret"
        
        aws secretsmanager delete-secret \
          --secret-id "$TMP" \
          --force-delete-without-recovery >/dev/null
        echo "  ✓ DeleteSecret"
        
        echo "✅ Preflight: All Secrets Manager permissions verified"

    - name: 🔐 Phase 3 - Secrets Manager (Application Secrets Only)
      run: |
        set -euo pipefail
        echo "🔐 Phase 3: Creating/updating application secrets in Secrets Manager"
        echo "Note: Cognito client secret managed in Phase 1 at oasis/staging/cognito_web_client_secret"
        
        # Generate NextAuth secret if not provided
        if [ -z "${{ inputs.nextauth_secret }}" ]; then
          NEXTAUTH_SECRET=$(openssl rand -base64 64)
        else
          NEXTAUTH_SECRET="${{ inputs.nextauth_secret }}"
        fi
        
        # Validate required variables
        required_vars=(DATABASE_URL NEXTAUTH_SECRET)
        for var in "${required_vars[@]}"; do
          if [ -z "${!var:-}" ]; then
            echo "❌ Phase 3: Missing required variable: $var"
            exit 1
          fi
        done
        
        # Idempotent secret upsert function
        upsert_secret() {
          local name="$1"
          local value="$2"
          local description="$3"
          
          if aws secretsmanager describe-secret --secret-id "$name" >/dev/null 2>&1; then
            echo "Updating existing secret: $name"
            aws secretsmanager put-secret-value \
              --secret-id "$name" \
              --secret-string "$value" >/dev/null
          else
            echo "Creating new secret: $name"
            aws secretsmanager create-secret \
              --name "$name" \
              --secret-string "$value" \
              --description "$description" \
              --tags Key=env,Value=staging >/dev/null
          fi
        }
        
        # Create/update the 3 application secrets
        upsert_secret \
          "oasis/staging/DATABASE_URL" \
          "$DATABASE_URL" \
          "Database URL for Oasis staging"
        
        upsert_secret \
          "oasis/staging/NEXTAUTH_SECRET" \
          "$NEXTAUTH_SECRET" \
          "NextAuth secret for Oasis staging"
        
        upsert_secret \
          "oasis/staging/NEXTAUTH_URL" \
          "https://app.oasis-care.co" \
          "NextAuth URL for Oasis staging"
        
        echo "✅ All application secrets created/updated (3/3)"
        echo "✅ Cognito secret already managed in Phase 1"

    - name: ℹ️ Phase 4 - ACM Certificates (Terraform-Managed)
      run: |
        echo "ℹ️ Phase 4: ACM certificates will be managed by Terraform"
        echo "Terraform will handle certificate creation and DNS validation automatically"
        echo "This ensures certificates are properly tracked in state"
        echo "✅ Skipping manual certificate creation - letting Terraform handle it"
    
    - name: 🧹 Terraform Lint & Format Validation
      uses: terraform-linters/setup-tflint@v4
      
    - name: 🔍 Run Terraform Format Check & TFLint
      working-directory: infrastructure/staging
      run: |
        echo "🔍 Checking Terraform formatting..."
        terraform fmt -check -recursive || echo "⚠️  Format check failed (non-blocking)"
        
        echo "🔍 Running TFLint..."
        tflint --init
        tflint -f sarif --out tflint.sarif || echo "⚠️  TFLint found issues (non-blocking)"
        
        echo "✅ Linting complete"
    
    - name: 📤 Upload TFLint SARIF Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tflint-sarif-results
        path: infrastructure/staging/tflint.sarif
        retention-days: 30

    - name: 📝 Phase 4.25 - Generate Terraform Variables File
      env:
        ROUTE53_ZONE_ID: ${{ env.ROUTE53_ZONE_ID }}
      working-directory: infrastructure/staging
      run: |
        set -euo pipefail
        echo "📝 Phase 4.25: Creating terraform.tfvars for imports & deployment"
        
        cat > terraform.tfvars <<EOF
        project         = "oasis-care"
        environment     = "staging"
        aws_region      = "eu-west-2"
        api_domain      = "api.oasis-care.co"
        web_domain      = "app.oasis-care.co"
        route53_zone_id = "$ROUTE53_ZONE_ID"
        kms_key_id      = "8995c5be-616f-4680-953e-8ed3b7252689"
        sns_topic_arn   = "arn:aws:sns:eu-west-2:721689331449:oasis-staging-alerts"
        EOF
        
        echo "✅ terraform.tfvars created"
        echo "Contents (redacted for security):"
        sed -E \
          -e 's|arn:aws:acm:[^"]+|[REDACTED-ACM-ARN]|g' \
          -e 's|Z[A-Z0-9]{13}|[REDACTED-ZONE-ID]|g' \
          terraform.tfvars | awk '{print "  " $0}'


    - name: 🏗️ Phase 5 - Infrastructure Deployment (Init, Import, Apply)
      env:
        TF_IN_AUTOMATION: "1"
      working-directory: infrastructure/staging
      run: |
        set -euo pipefail
        echo "🏗️ Phase 5: Terraform Init, Import, and Apply"
        echo "Using terraform.tfvars from Phase 4.25"
        
        echo "=== Step 1: Terraform Init ==="
        terraform init -input=false -upgrade
        terraform workspace select staging || terraform workspace new staging
        
        echo "=== Step 2: Import Existing Resources ==="
        echo "Running automated import script..."
        bash ../../_generated/terraform-import-all.sh || echo "⚠️ Some imports may have failed (non-blocking)"
        
        echo ""
        echo "=== Step 3: Terraform State Check ==="
        RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l || echo "0")
        echo "State now contains $RESOURCE_COUNT resources"
        terraform state list | head -20 || echo "(No resources in state)"
        if [ "$RESOURCE_COUNT" -gt 5 ]; then
          echo "..."
        fi
        
        echo ""
        echo "=== Step 4: Terraform Plan ==="
        terraform plan -var-file=terraform.tfvars -lock-timeout=5m -no-color -out=tfplan
        
        echo ""
        echo "=== Step 5: Terraform Apply ==="
        terraform apply -var-file=terraform.tfvars -auto-approve -lock-timeout=5m
        
        # Export outputs for later steps
        terraform output -json > ../outputs.json
        
        echo "✅ Infrastructure deployed successfully"
    
    - name: 📤 Upload Terraform Plan Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: terraform-plan-staging
        path: infrastructure/staging/tfplan.tgz
        retention-days: 30

    - name: 📦 Phase 6 - Build & Push Container Images
      run: |
        echo "📦 Phase 6: Building and pushing Docker images"
        
        # Login to ECR
        aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com
        
        # Build and push API image
        echo "🔨 Building API image..."
        docker build -t oasis-api:staging -f apps/api/Dockerfile .
        docker tag oasis-api:staging 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com/oasis-api:staging
        docker push 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com/oasis-api:staging
        
        # Build and push Web image  
        echo "🔨 Building Web image..."
        docker build -t oasis-web:staging -f apps/web/Dockerfile .
        docker tag oasis-web:staging 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com/oasis-web:staging
        docker push 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com/oasis-web:staging
        
        echo "✅ Container images built and pushed"

    - name: ⚡ Phase 7 - Verify ECS Services
      working-directory: infrastructure/staging
      run: |
        echo "⚡ Phase 7: Verifying ECS services are running"
        
        # Get cluster and service names from terraform output
        CLUSTER_NAME=$(cat ../outputs.json | jq -r '.ecs_cluster_name.value')
        API_SERVICE=$(cat ../outputs.json | jq -r '.ecs_api_service_name.value')
        WEB_SERVICE=$(cat ../outputs.json | jq -r '.ecs_web_service_name.value')
        
        echo "Cluster: $CLUSTER_NAME"
        echo "API Service: $API_SERVICE"
        echo "Web Service: $WEB_SERVICE"
        
        # Check if services exist before waiting
        if aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$API_SERVICE" "$WEB_SERVICE" --region eu-west-2 >/dev/null 2>&1; then
          echo "⏳ Waiting for ECS services to stabilize..."
          aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$API_SERVICE" "$WEB_SERVICE" --region eu-west-2
          echo "✅ ECS services are stable"
        else
          echo "⚠️ ECS services not found - may still be creating or Terraform apply failed"
          echo "Checking service status..."
          aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$API_SERVICE" "$WEB_SERVICE" --region eu-west-2 || true
        fi

    - name: 🌐 Phase 8 - Route53 DNS Records
      run: |
        echo "🌐 Phase 8: Creating Route53 DNS records"
        
        # Get ALB DNS name from terraform output
        ALB_DNS=$(cat infrastructure/outputs.json | jq -r '.alb_dns_name.value')
        ALB_ZONE_ID=$(cat infrastructure/outputs.json | jq -r '.alb_zone_id.value')
        
        # Create DNS records
        cat > dns-records.json << EOF
        {
          "Changes": [
            {
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "app.oasis-care.co",
                "Type": "A",
                "AliasTarget": {
                  "DNSName": "$ALB_DNS",
                  "EvaluateTargetHealth": true,
                  "HostedZoneId": "$ALB_ZONE_ID"
                }
              }
            },
            {
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "api.oasis-care.co", 
                "Type": "A",
                "AliasTarget": {
                  "DNSName": "$ALB_DNS",
                  "EvaluateTargetHealth": true,
                  "HostedZoneId": "$ALB_ZONE_ID"
                }
              }
            }
          ]
        }
        EOF
        
        aws route53 change-resource-record-sets \
          --hosted-zone-id $ROUTE53_ZONE_ID \
          --change-batch file://dns-records.json
        
        echo "⏳ Waiting for DNS propagation..."
        sleep 30
        
        # Verify DNS resolution
        nslookup app.oasis-care.co
        nslookup api.oasis-care.co
        
        echo "✅ DNS records created and propagating"

    - name: 🔧 Setup Node.js for Database Operations
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: 🔧 Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9.13.1

    - name: 📦 Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: 🗄️ Phase 9 - Database Setup
      run: |
        echo "🗄️ Phase 9: Database migrations and seeding"
        
        # Export DATABASE_URL for local operations
        export DATABASE_URL="$DATABASE_URL"
        
        # Enable pgvector extension
        echo "🔌 Enabling pgvector extension..."
        psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;' || true
        
        # Generate Prisma client
        echo "⚙️ Generating Prisma client..."
        pnpm --filter @oasis/db exec prisma generate
        
        # Run migrations
        echo "🔄 Running database migrations..."
        pnpm --filter @oasis/db prisma migrate deploy
        
        # Run seed
        echo "🌱 Seeding database..."
        pnpm --filter @oasis/db run seed
        
        echo "✅ Database setup completed"

    - name: 🧪 Phase 10 - Smoke Tests
      run: |
        echo "🧪 Phase 10: Running smoke tests"
        
        # Wait a bit more for services to be ready
        sleep 60
        
        echo "🔍 Testing API health endpoint..."
        curl -f -I https://api.oasis-care.co/health || (echo "❌ API health check failed" && exit 1)
        
        echo "🔍 Testing Web app endpoint..."
        curl -f -I https://app.oasis-care.co || (echo "❌ Web app health check failed" && exit 1)
        
        echo "✅ Smoke tests passed"

    - name: 📊 Phase 11 - Monitoring Setup
      run: |
        echo "📊 Phase 11: Setting up CloudWatch monitoring"
        
        # Test SNS topic with a success notification
        aws sns publish \
