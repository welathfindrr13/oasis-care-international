name: Deploy Oasis Care to Staging

on:
  workflow_dispatch:
    inputs:
      cognito_client_secret:
        description: 'Cognito Client Secret (leave blank to auto-generate if needed)'
        required: false
        type: string
      nextauth_secret:
        description: 'NextAuth Secret (leave blank to auto-generate)'
        required: false  
        type: string
      route53_zone_id:
        description: 'Route53 Zone ID (leave blank to auto-detect)'
        required: false
        type: string
      admin_email:
        description: 'Admin user email for demo'
        required: false
        default: 'boss@oasis-care.com'
        type: string
      carer_email:
        description: 'Carer demo email'
        required: false
        default: 'carer-demo@oasis-care.com'
        type: string

env:
  AWS_REGION: eu-west-2
  PROJECT_NAME: oasis-care
  ENVIRONMENT: staging
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: 🚀 Starting Oasis Care Staging Deployment
      run: |
        echo "🏥 OASIS CARE - STAGING DEPLOYMENT STARTING"
        echo "Target domains: app.oasis-care.com, api.oasis-care.com"
        echo "AWS Region: ${{ env.AWS_REGION }}"
        echo "Time: $(date)"

    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        ref: feat/staging-live-setup

    - name: 🔑 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: ✅ Verify AWS Connection
      run: |
        echo "🔍 Verifying AWS connection..."
        aws sts get-caller-identity
        echo "AWS connection verified!"

    - name: 🏗️ Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0

    - name: 📋 Phase 0 - Pre-flight Setup
      working-directory: infrastructure/staging
      run: |
        echo "🏁 Phase 0: Pre-flight checks"
        terraform init -upgrade
        terraform workspace select staging || terraform workspace new staging
        
        # Auto-detect Route53 zone ID if not provided
        if [ -z "${{ inputs.route53_zone_id }}" ]; then
          echo "Auto-detecting Route53 zone ID..."
          ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name oasis-care.com --query "HostedZones[0].Id" --output text | sed 's|/hostedzone/||')
          echo "ROUTE53_ZONE_ID=$ZONE_ID" >> $GITHUB_ENV
        else
          echo "ROUTE53_ZONE_ID=${{ inputs.route53_zone_id }}" >> $GITHUB_ENV
        fi

    - name: 🔐 Phase 1 - Cognito Client Secret
      run: |
        echo "🔐 Phase 1: Getting/Setting Cognito Client Secret"
        
        if [ -z "${{ inputs.cognito_client_secret }}" ]; then
          echo "Checking if Cognito client secret exists..."
          CLIENT_SECRET=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id eu-west-2_YPo6sl1zm \
            --client-id 3imuihdo5v7lgimq8je6d38std \
            --query "UserPoolClient.ClientSecret" --output text 2>/dev/null || echo "None")
          
          if [ "$CLIENT_SECRET" = "None" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "Enabling client secret generation..."
            aws cognito-idp update-user-pool-client \
              --user-pool-id eu-west-2_YPo6sl1zm \
              --client-id 3imuihdo5v7lgimq8je6d38std \
              --generate-secret
            sleep 5
            CLIENT_SECRET=$(aws cognito-idp describe-user-pool-client \
              --user-pool-id eu-west-2_YPo6sl1zm \
              --client-id 3imuihdo5v7lgimq8je6d38std \
              --query "UserPoolClient.ClientSecret" --output text)
          fi
        else
          CLIENT_SECRET="${{ inputs.cognito_client_secret }}"
        fi
        
        echo "COGNITO_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV
        echo "✅ Cognito client secret configured"

    - name: 🗄️ Phase 2 - RDS Setup  
      run: |
        echo "🗄️ Phase 2: RDS password and endpoint setup"
        
        # Determine actual RDS identifier
        RDS_ID=""
        for candidate in "oasis-staging" "oasis-care-staging-db"; do
          if aws rds describe-db-instances --db-instance-identifier "$candidate" >/dev/null 2>&1; then
            RDS_ID="$candidate"
            break
          fi
        done
        
        if [ -z "$RDS_ID" ]; then
          echo "❌ No RDS instance found. Please ensure RDS is created first."
          exit 1
        fi
        
        echo "📊 Using RDS instance: $RDS_ID"
        
        # Get RDS endpoint
        RDS_ENDPOINT=$(aws rds describe-db-instances \
          --db-instance-identifier "$RDS_ID" \
          --query "DBInstances[0].Endpoint.Address" --output text)
        
        # Reset master password  
        echo "🔄 Resetting RDS master password..."
        aws rds modify-db-instance \
          --db-instance-identifier "$RDS_ID" \
          --master-user-password "$(openssl rand -base64 32)" \
          --apply-immediately
        
        # Wait for available state
        echo "⏳ Waiting for RDS to become available..."
        aws rds wait db-instance-available --db-instance-identifier "$RDS_ID"
        
        # Get the new password (we'll get it from the master user password)
        NEW_PASSWORD=$(openssl rand -base64 32)
        
        # Build DATABASE_URL (URL encode password)
        ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$NEW_PASSWORD'))")
        DATABASE_URL="postgresql://oasis:$ENCODED_PASSWORD@$RDS_ENDPOINT:5432/oasis"
        
        echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV
        echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
        echo "✅ RDS configured - endpoint: $RDS_ENDPOINT"

    - name: 🔐 Phase 3 - Secrets Manager
      run: |
        echo "🔐 Phase 3: Creating/updating secrets in Secrets Manager"
        
        # Generate NextAuth secret if not provided
        if [ -z "${{ inputs.nextauth_secret }}" ]; then
          NEXTAUTH_SECRET=$(openssl rand -base64 64)
        else
          NEXTAUTH_SECRET="${{ inputs.nextauth_secret }}"
        fi
        
        # Create/update secrets
        echo "Creating DATABASE_URL secret..."
        aws secretsmanager create-secret --name oasis/staging/DATABASE_URL \
          --secret-string "$DATABASE_URL" \
          --description "Database URL for Oasis staging" 2>/dev/null || \
        aws secretsmanager update-secret --secret-id oasis/staging/DATABASE_URL \
          --secret-string "$DATABASE_URL"
        
        echo "Creating NEXTAUTH_SECRET secret..."
        aws secretsmanager create-secret --name oasis/staging/NEXTAUTH_SECRET \
          --secret-string "$NEXTAUTH_SECRET" \
          --description "NextAuth secret for Oasis staging" 2>/dev/null || \
        aws secretsmanager update-secret --secret-id oasis/staging/NEXTAUTH_SECRET \
          --secret-string "$NEXTAUTH_SECRET"
        
        echo "Creating NEXTAUTH_URL secret..."
        aws secretsmanager create-secret --name oasis/staging/NEXTAUTH_URL \
          --secret-string "https://app.oasis-care.com" \
          --description "NextAuth URL for Oasis staging" 2>/dev/null || \
        aws secretsmanager update-secret --secret-id oasis/staging/NEXTAUTH_URL \
          --secret-string "https://app.oasis-care.com"
        
        echo "Creating COGNITO_CLIENT_SECRET secret..."
        aws secretsmanager create-secret --name oasis/staging/COGNITO_CLIENT_SECRET \
          --secret-string "$COGNITO_CLIENT_SECRET" \
          --description "Cognito client secret for Oasis staging" 2>/dev/null || \
        aws secretsmanager update-secret --secret-id oasis/staging/COGNITO_CLIENT_SECRET \
          --secret-string "$COGNITO_CLIENT_SECRET"
        
        echo "✅ All secrets created/updated in Secrets Manager"

    - name: 🔒 Phase 4 - ACM Certificates
      run: |
        echo "🔒 Phase 4: Requesting ACM certificates"
        
        # Request certificate for app.oasis-care.com
        echo "Requesting certificate for app.oasis-care.com..."
        APP_CERT_ARN=$(aws acm request-certificate \
          --domain-name app.oasis-care.com \
          --validation-method DNS \
          --query CertificateArn --output text)
        echo "APP_CERT_ARN=$APP_CERT_ARN" >> $GITHUB_ENV
        
        # Request certificate for api.oasis-care.com
        echo "Requesting certificate for api.oasis-care.com..."
        API_CERT_ARN=$(aws acm request-certificate \
          --domain-name api.oasis-care.com \
          --validation-method DNS \
          --query CertificateArn --output text)
        echo "API_CERT_ARN=$API_CERT_ARN" >> $GITHUB_ENV
        
        # Wait a moment for certificates to be processable
        sleep 10
        
        # Create DNS validation records
        echo "Creating DNS validation records..."
        
        # Get validation records for app cert
        aws acm describe-certificate --certificate-arn $APP_CERT_ARN \
          --query 'Certificate.DomainValidationOptions[0]' --output json > app_validation.json
        
        APP_VALIDATION_NAME=$(cat app_validation.json | jq -r '.ResourceRecord.Name')
        APP_VALIDATION_VALUE=$(cat app_validation.json | jq -r '.ResourceRecord.Value')
        
        # Get validation records for api cert  
        aws acm describe-certificate --certificate-arn $API_CERT_ARN \
          --query 'Certificate.DomainValidationOptions[0]' --output json > api_validation.json
          
        API_VALIDATION_NAME=$(cat api_validation.json | jq -r '.ResourceRecord.Name')
        API_VALIDATION_VALUE=$(cat api_validation.json | jq -r '.ResourceRecord.Value')
        
        # Create Route53 records
        cat > validation-records.json << EOF
        {
          "Changes": [
            {
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "$APP_VALIDATION_NAME",
                "Type": "CNAME",
                "TTL": 300,
                "ResourceRecords": [{"Value": "$APP_VALIDATION_VALUE"}]
              }
            },
            {
              "Action": "UPSERT", 
              "ResourceRecordSet": {
                "Name": "$API_VALIDATION_NAME",
                "Type": "CNAME",
                "TTL": 300,
                "ResourceRecords": [{"Value": "$API_VALIDATION_VALUE"}]
              }
            }
          ]
        }
        EOF
        
        aws route53 change-resource-record-sets \
          --hosted-zone-id $ROUTE53_ZONE_ID \
          --change-batch file://validation-records.json
        
        echo "⏳ Waiting for certificate validation (this may take 5-10 minutes)..."
        aws acm wait certificate-validated --certificate-arn $APP_CERT_ARN &
        aws acm wait certificate-validated --certificate-arn $API_CERT_ARN &
        wait
        
        echo "✅ Certificates validated and issued"

    - name: 🏗️ Phase 5 - Infrastructure Deployment  
      working-directory: infrastructure/staging
      run: |
        echo "🏗️ Phase 5: Deploying infrastructure with Terraform"
        
        # Update terraform variables
        cat > terraform.tfvars << EOF
        project = "oasis-care"
        environment = "staging"
        aws_region = "eu-west-2"
        api_domain = "api.oasis-care.com"
        web_domain = "app.oasis-care.com"
        route53_zone_id = "$ROUTE53_ZONE_ID"
        app_cert_arn = "$APP_CERT_ARN"
        api_cert_arn = "$API_CERT_ARN"
        kms_key_id = "8995c5be-616f-4680-953e-8ed3b7252689"
        sns_topic_arn = "arn:aws:sns:eu-west-2:721689331449:oasis-staging-alerts"
        EOF
        
        terraform plan -var-file=terraform.tfvars
        terraform apply -var-file=terraform.tfvars -auto-approve
        
        # Export outputs for later steps
        terraform output -json > ../outputs.json
        
        echo "✅ Infrastructure deployed successfully"

    - name: 📦 Phase 6 - Build & Push Container Images
      run: |
        echo "📦 Phase 6: Building and pushing Docker images"
        
        # Login to ECR
        aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com
        
        # Build and push API image
        echo "🔨 Building API image..."
        docker build -t oasis-api:staging -f apps/api/Dockerfile .
        docker tag oasis-api:staging 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com/oasis-api:staging
        docker push 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com/oasis-api:staging
        
        # Build and push Web image  
        echo "🔨 Building Web image..."
        docker build -t oasis-web:staging -f apps/web/Dockerfile .
        docker tag oasis-web:staging 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com/oasis-web:staging
        docker push 721689331449.dkr.ecr.$AWS_REGION.amazonaws.com/oasis-web:staging
        
        echo "✅ Container images built and pushed"

    - name: ⚡ Phase 7 - ECS Services Deployment
      working-directory: infrastructure/staging
      run: |
        echo "⚡ Phase 7: Updating ECS services with new images"
        
        # Update ECS services to use new images
        terraform apply -var-file=terraform.tfvars -auto-approve
        
        # Wait for services to stabilize
        echo "⏳ Waiting for ECS services to stabilize..."
        
        # Get cluster and service names from terraform output
        CLUSTER_NAME=$(cat ../outputs.json | jq -r '.ecs_cluster_name.value')
        API_SERVICE=$(cat ../outputs.json | jq -r '.ecs_api_service_name.value')
        WEB_SERVICE=$(cat ../outputs.json | jq -r '.ecs_web_service_name.value')
        
        aws ecs wait services-stable --cluster $CLUSTER_NAME --services $API_SERVICE $WEB_SERVICE
        
        echo "✅ ECS services deployed and stable"

    - name: 🌐 Phase 8 - Route53 DNS Records
      run: |
        echo "🌐 Phase 8: Creating Route53 DNS records"
        
        # Get ALB DNS name from terraform output
        ALB_DNS=$(cat infrastructure/outputs.json | jq -r '.alb_dns_name.value')
        ALB_ZONE_ID=$(cat infrastructure/outputs.json | jq -r '.alb_zone_id.value')
        
        # Create DNS records
        cat > dns-records.json << EOF
        {
          "Changes": [
            {
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "app.oasis-care.com",
                "Type": "A",
                "AliasTarget": {
                  "DNSName": "$ALB_DNS",
                  "EvaluateTargetHealth": true,
                  "HostedZoneId": "$ALB_ZONE_ID"
                }
              }
            },
            {
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "api.oasis-care.com", 
                "Type": "A",
                "AliasTarget": {
                  "DNSName": "$ALB_DNS",
                  "EvaluateTargetHealth": true,
                  "HostedZoneId": "$ALB_ZONE_ID"
                }
              }
            }
          ]
        }
        EOF
        
        aws route53 change-resource-record-sets \
          --hosted-zone-id $ROUTE53_ZONE_ID \
          --change-batch file://dns-records.json
        
        echo "⏳ Waiting for DNS propagation..."
        sleep 30
        
        # Verify DNS resolution
        nslookup app.oasis-care.com
        nslookup api.oasis-care.com
        
        echo "✅ DNS records created and propagating"

    - name: 🔧 Setup Node.js for Database Operations
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: 🔧 Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9.13.1

    - name: 📦 Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: 🗄️ Phase 9 - Database Setup
      run: |
        echo "🗄️ Phase 9: Database migrations and seeding"
        
        # Export DATABASE_URL for local operations
        export DATABASE_URL="$DATABASE_URL"
        
        # Enable pgvector extension
        echo "🔌 Enabling pgvector extension..."
        psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;' || true
        
        # Generate Prisma client
        echo "⚙️ Generating Prisma client..."
        pnpm --filter @oasis/db exec prisma generate
        
        # Run migrations
        echo "🔄 Running database migrations..."
        pnpm --filter @oasis/db prisma migrate deploy
        
        # Run seed
        echo "🌱 Seeding database..."
        pnpm --filter @oasis/db run seed
        
        echo "✅ Database setup completed"

    - name: 🧪 Phase 10 - Smoke Tests
      run: |
        echo "🧪 Phase 10: Running smoke tests"
        
        # Wait a bit more for services to be ready
        sleep 60
        
        echo "🔍 Testing API health endpoint..."
        curl -f -I https://api.oasis-care.com/health || (echo "❌ API health check failed" && exit 1)
        
        echo "🔍 Testing Web app endpoint..."
        curl -f -I https://app.oasis-care.com || (echo "❌ Web app health check failed" && exit 1)
        
        echo "✅ Smoke tests passed"

    - name: 📊 Phase 11 - Monitoring Setup
      run: |
        echo "📊 Phase 11: Setting up CloudWatch monitoring"
        
        # Test SNS topic with a success notification
        aws sns publish \
          --topic-arn "arn:aws:sns:eu-west-2:721689331449:oasis-staging-alerts" \
          --message "🎉 Oasis Care staging deployment completed successfully! 
        
        ✅ Deployed at: $(date)
        🌐 Web: https://app.oasis-care.com  
        🔌 API: https://api.oasis-care.com
        📊 Monitoring: Active
        
        All systems operational." \
          --subject "Oasis Care Staging - Deployment Success"
        
        echo "✅ Monitoring configured and test notification sent"

    - name: 📋 Phase 12 - Deployment Report
      run: |
        echo "📋 Phase 12: Generating deployment report"
        
        cat > deployment-report.md << EOF
        # 🏥 OASIS CARE STAGING DEPLOYMENT REPORT
        
        **Deployment Time:** $(date)
        **Status:** ✅ SUCCESSFUL
        **Branch:** feat/staging-live-setup
        
        ## 🌐 Live Endpoints
        - **Web Application:** https://app.oasis-care.com
        - **API:** https://api.oasis-care.com
        
        ## 📋 Resources Deployed
        
        ### 🔒 ACM Certificates
        - **App Certificate:** $APP_CERT_ARN (ISSUED)
        - **API Certificate:** $API_CERT_ARN (ISSUED)
        
        ### 🌐 Load Balancer  
        - **ALB DNS:** $(cat infrastructure/outputs.json | jq -r '.alb_dns_name.value')
        - **Route53 Records:** ✅ Created for both domains
        
        ### 📦 Container Images
        - **API Image:** 721689331449.dkr.ecr.eu-west-2.amazonaws.com/oasis-api:staging
        - **Web Image:** 721689331449.dkr.ecr.eu-west-2.amazonaws.com/oasis-web:staging
        
        ### ⚡ ECS Services
        - **API Service:** $(cat infrastructure/outputs.json | jq -r '.ecs_api_service_arn.value')
        - **Web Service:** $(cat infrastructure/outputs.json | jq -r '.ecs_web_service_arn.value')
        - **Target Groups:** ✅ Healthy
        
        ### 🔐 Secrets Manager
        - ✅ oasis/staging/DATABASE_URL
        - ✅ oasis/staging/NEXTAUTH_SECRET  
        - ✅ oasis/staging/NEXTAUTH_URL
        - ✅ oasis/staging/COGNITO_CLIENT_SECRET
        
        ### 🗄️ Database
        - **RDS Endpoint:** $RDS_ENDPOINT
        - **pgvector Extension:** ✅ Enabled
        - **Migrations:** ✅ Applied
        - **Seed Data:** ✅ Populated
        
        ### 🧪 Verification Results
        - **API Health:** ✅ https://api.oasis-care.com/health
        - **Web Health:** ✅ https://app.oasis-care.com
        - **DNS Resolution:** ✅ Both domains resolving
        
        ### 📊 Monitoring
        - **CloudWatch Alarms:** ✅ Configured
        - **SNS Notifications:** ✅ Active (arn:aws:sns:eu-west-2:721689331449:oasis-staging-alerts)
        - **Log Groups:** ✅ Receiving logs
        
        ## 🎯 Next Steps
        1. **Test Authentication:** Visit https://app.oasis-care.com and test Cognito login
        2. **Create Users:** Set up admin and carer demo accounts in Cognito
        3. **Verify RBAC:** Test role-based access control
        4. **Monitor Metrics:** Check CloudWatch dashboards
        
        ## 🏁 Deployment Complete!
        Oasis Care is now live on staging at **https://app.oasis-care.com**
        EOF
        
        cat deployment-report.md
        
        echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY!"
        echo "🌐 Web: https://app.oasis-care.com"
        echo "🔌 API: https://api.oasis-care.com"
