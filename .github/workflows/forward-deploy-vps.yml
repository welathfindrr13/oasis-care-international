name: Forward Deploy VPS

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed lowercase 40-character application SHA to deploy.
        required: true
        type: string
      workflow_sha:
        description: Exact reviewed lowercase 40-character workflow SHA at current origin main.
        required: true
        type: string
      attempt_id:
        description: Fresh lowercase 32-character hexadecimal forward-deployment attempt identifier.
        required: true
        type: string
      production_code_approval:
        description: Exact SHA, workflow, attempt, and starting-state approval token.
        required: true
        type: string

concurrency:
  group: production-vps-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forward-deploy:
    name: Forward deploy from durable legacy rollback
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      EXPECTED_TARGET_SHA: 841b08e886446a7dbf019198b9c36426e245ee21
      STATE_OPERATION_TIMEOUT_SECONDS: "15"
      FETCH_TIMEOUT_SECONDS: "90"
      CHECKOUT_TIMEOUT_SECONDS: "60"
      PREFLIGHT_TIMEOUT_SECONDS: "60"
      BUILD_TIMEOUT_SECONDS: "900"
      DIAGNOSTIC_TIMEOUT_SECONDS: "10"
      DIAGNOSTIC_FILE_READ_TIMEOUT_SECONDS: "2"
      REVISION_PROOF_TIMEOUT_SECONDS: "30"
      REPLACEMENT_TIMEOUT_SECONDS: "300"
      ROLLBACK_TIMEOUT_SECONDS: "300"
      SHORT_KILL_GRACE_SECONDS: "2"
      PHASE_KILL_GRACE_SECONDS: "15"
      TARGET_VERIFICATION_BUDGET_SECONDS: "210"
      COMPLETION_BUDGET_SECONDS: "120"
      FAILURE_DIAGNOSTIC_BUDGET_SECONDS: "185"
      LEGACY_ALIAS_GUARD_BUDGET_SECONDS: "72"
      INLINE_ROLLBACK_BUDGET_SECONDS: "580"
      CLEANUP_BUDGET_SECONDS: "12"
      POST_MUTATION_MAX_SECONDS: "2642"
      RECOVERY_LOCK_SAFETY_MARGIN_SECONDS: "50"
      RECOVERY_LOCK_WAIT_SECONDS: "2692"
      RECOVERY_SUPERVISOR_HANDSHAKE_SECONDS: "10"
      TRANSPORT_TIMEOUT_SECONDS: "1890"
      TRANSPORT_KILL_GRACE_SECONDS: "600"
      RECOVERY_RECONNECT_TIMEOUT_SECONDS: "75"
      OASIS_PRODUCTION_APP_URL: ${{ vars.OASIS_PRODUCTION_APP_URL }}
      OASIS_PRODUCTION_VPS_HOST: ${{ secrets.OASIS_PRODUCTION_VPS_HOST }}
      OASIS_PRODUCTION_VPS_USER: ${{ secrets.OASIS_PRODUCTION_VPS_USER }}
      OASIS_PRODUCTION_VPS_SSH_KEY: ${{ secrets.OASIS_PRODUCTION_VPS_SSH_KEY }}
      OASIS_PRODUCTION_VPS_KNOWN_HOSTS: ${{ secrets.OASIS_PRODUCTION_VPS_KNOWN_HOSTS }}
      TARGET_SHA: ${{ inputs.target_sha }}
      WORKFLOW_SHA: ${{ inputs.workflow_sha }}
      ATTEMPT_ID: ${{ inputs.attempt_id }}
      PRODUCTION_CODE_APPROVAL: ${{ inputs.production_code_approval }}
    steps:
      - name: Checkout reviewed workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate target, workflow, attempt, approval, and transport
        shell: bash
        run: |
          set -euo pipefail

          fail_inputs() {
            printf 'FORWARD_INPUTS_INVALID\n' >&2
            exit 1
          }

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || fail_inputs
          [ "$TARGET_SHA" = "$EXPECTED_TARGET_SHA" ] || fail_inputs
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || fail_inputs
          [[ "$ATTEMPT_ID" =~ ^[0-9a-f]{32}$ ]] || fail_inputs
          [ "$GITHUB_REF" = "refs/heads/main" ] || fail_inputs
          [ "$GITHUB_SHA" = "$WORKFLOW_SHA" ] || fail_inputs
          required_approval="APPROVE_FORWARD_DEPLOY_${TARGET_SHA}_WITH_${WORKFLOW_SHA}_ATTEMPT_${ATTEMPT_ID}_FROM_LEGACY_ROLLED_BACK"
          [ "$PRODUCTION_CODE_APPROVAL" = "$required_approval" ] || fail_inputs
          [ -n "$OASIS_PRODUCTION_VPS_HOST" ] || fail_inputs
          [ -n "$OASIS_PRODUCTION_VPS_USER" ] || fail_inputs
          [ "$OASIS_PRODUCTION_VPS_USER" = "deploy" ] || fail_inputs
          [ -n "$OASIS_PRODUCTION_VPS_SSH_KEY" ] || fail_inputs
          [ -n "$OASIS_PRODUCTION_VPS_KNOWN_HOSTS" ] || fail_inputs
          [ -n "$OASIS_PRODUCTION_APP_URL" ] || fail_inputs
          [[ "$OASIS_PRODUCTION_VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]] || fail_inputs
          [[ "$OASIS_PRODUCTION_VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || fail_inputs
          [ "$GITHUB_REPOSITORY" = "welathfindrr13/oasis-care-international" ] || fail_inputs

          computed_post_mutation_max=$((
            STATE_OPERATION_TIMEOUT_SECONDS + SHORT_KILL_GRACE_SECONDS +
            FETCH_TIMEOUT_SECONDS + SHORT_KILL_GRACE_SECONDS +
            CHECKOUT_TIMEOUT_SECONDS + SHORT_KILL_GRACE_SECONDS +
            PREFLIGHT_TIMEOUT_SECONDS + SHORT_KILL_GRACE_SECONDS +
            BUILD_TIMEOUT_SECONDS + PHASE_KILL_GRACE_SECONDS +
            LEGACY_ALIAS_GUARD_BUDGET_SECONDS +
            REPLACEMENT_TIMEOUT_SECONDS + PHASE_KILL_GRACE_SECONDS +
            TARGET_VERIFICATION_BUDGET_SECONDS +
            COMPLETION_BUDGET_SECONDS +
            FAILURE_DIAGNOSTIC_BUDGET_SECONDS +
            INLINE_ROLLBACK_BUDGET_SECONDS +
            CLEANUP_BUDGET_SECONDS
          ))
          [ "$computed_post_mutation_max" -eq "$POST_MUTATION_MAX_SECONDS" ] || fail_inputs
          [ "$RECOVERY_LOCK_WAIT_SECONDS" -eq $((POST_MUTATION_MAX_SECONDS + RECOVERY_LOCK_SAFETY_MARGIN_SECONDS)) ] || fail_inputs
          [ "$RECOVERY_LOCK_SAFETY_MARGIN_SECONDS" -gt 0 ] || fail_inputs
          [ "$TRANSPORT_TIMEOUT_SECONDS" -ge $((
            STATE_OPERATION_TIMEOUT_SECONDS + SHORT_KILL_GRACE_SECONDS +
            FETCH_TIMEOUT_SECONDS + SHORT_KILL_GRACE_SECONDS +
            CHECKOUT_TIMEOUT_SECONDS + SHORT_KILL_GRACE_SECONDS +
            PREFLIGHT_TIMEOUT_SECONDS + SHORT_KILL_GRACE_SECONDS +
            BUILD_TIMEOUT_SECONDS + PHASE_KILL_GRACE_SECONDS +
            LEGACY_ALIAS_GUARD_BUDGET_SECONDS +
            REPLACEMENT_TIMEOUT_SECONDS + PHASE_KILL_GRACE_SECONDS +
            TARGET_VERIFICATION_BUDGET_SECONDS +
            COMPLETION_BUDGET_SECONDS
          )) ] || fail_inputs
          [ "$TRANSPORT_KILL_GRACE_SECONDS" -gt "$INLINE_ROLLBACK_BUDGET_SECONDS" ] || fail_inputs
          [ $((TRANSPORT_TIMEOUT_SECONDS + TRANSPORT_KILL_GRACE_SECONDS + RECOVERY_RECONNECT_TIMEOUT_SECONDS)) -le $((45 * 60 - 135)) ] || fail_inputs

          if ! OASIS_PRODUCTION_APP_URL="$OASIS_PRODUCTION_APP_URL" node --input-type=module <<'NODE' >/dev/null 2>&1
          import { normalizeBaseUrl } from './.github/workflows/revision-proof.mjs';
          normalizeBaseUrl(process.env.OASIS_PRODUCTION_APP_URL);
          NODE
          then
            fail_inputs
          fi
          printf 'FORWARD_INPUTS_VALID\n'

      - name: Prove target and reviewed workflow against current origin main
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_file="$(mktemp)"
          chmod 600 "$diagnostic_file"
          trap 'rm -f "$diagnostic_file"' EXIT

          if ! git fetch --no-tags origin main >"$diagnostic_file" 2>&1; then
            printf 'FORWARD_TARGET_PROOF_FAILED\n' >&2
            exit 1
          fi
          origin_main="$(git rev-parse origin/main 2>/dev/null)" || {
            printf 'FORWARD_TARGET_PROOF_FAILED\n' >&2
            exit 1
          }
          [ "$origin_main" = "$WORKFLOW_SHA" ] || {
            printf 'FORWARD_TARGET_PROOF_FAILED\n' >&2
            exit 1
          }
          git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null || {
            printf 'FORWARD_TARGET_PROOF_FAILED\n' >&2
            exit 1
          }
          git merge-base --is-ancestor "$TARGET_SHA" "$WORKFLOW_SHA" >"$diagnostic_file" 2>&1 || {
            printf 'FORWARD_TARGET_PROOF_FAILED\n' >&2
            exit 1
          }
          [ -z "$(git status --porcelain --untracked-files=all)" ] || {
            printf 'FORWARD_TARGET_PROOF_FAILED\n' >&2
            exit 1
          }
          printf 'FORWARD_TARGET_PROOF_VALID\n'

      - name: Configure production transport
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          key_file=~/.ssh/oasis_production_vps
          printf '%s\n' "$OASIS_PRODUCTION_VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$OASIS_PRODUCTION_VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || {
            printf 'PRODUCTION_TRANSPORT_FAILED\n' >&2
            exit 1
          }
          printf 'PRODUCTION_TRANSPORT_READY\n'

      - name: Stage reviewed forward helpers
        shell: bash
        run: |
          set -euo pipefail
          marker_capture="$(mktemp)"
          marker_stderr="$(mktemp)"
          helper_dir_capture="$(mktemp)"
          chmod 600 "$marker_capture" "$marker_stderr" "$helper_dir_capture"
          trap 'rm -f "$marker_capture" "$marker_stderr" "$helper_dir_capture"' EXIT

          set +e
          ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" \
            bash -se \
            >"$marker_capture" 2>"$marker_stderr" <<'FORWARD_REMOTE_TARGET_PROBE'
          set -euo pipefail
          fail_target_probe() {
            printf '%s\n' "$1"
            exit 1
          }
          effective_user="$(id -un 2>/dev/null)" || fail_target_probe DEPLOY_TARGET_IDENTITY_FAILED
          [ "$effective_user" = deploy ] || fail_target_probe DEPLOY_TARGET_IDENTITY_FAILED
          target_class_file=/etc/oasis/production-deploy-target-class
          for target_class_parent in / /etc /etc/oasis; do
            [ -d "$target_class_parent" ] && [ -x "$target_class_parent" ] ||
              fail_target_probe DEPLOY_TARGET_TRAVERSAL_FAILED
          done
          [ -f "$target_class_file" ] && [ ! -L "$target_class_file" ] ||
            fail_target_probe DEPLOY_TARGET_FILE_TYPE_FAILED
          [ -r "$target_class_file" ] ||
            fail_target_probe DEPLOY_TARGET_READABILITY_FAILED
          target_class="$(tr -d '\r\n' < "$target_class_file" 2>/dev/null)" ||
            fail_target_probe DEPLOY_TARGET_READABILITY_FAILED
          [ "$target_class" = production ] ||
            fail_target_probe DEPLOY_TARGET_VALUE_COMPARISON_FAILED
          printf 'FORWARD_REMOTE_IDENTITY_VALID\n'
          printf 'DEPLOY_TARGET_PRODUCTION\n'
          FORWARD_REMOTE_TARGET_PROBE
          marker_status=$?
          set -e
          marker_output="$(cat "$marker_capture")"
          expected_marker_output=$'FORWARD_REMOTE_IDENTITY_VALID\nDEPLOY_TARGET_PRODUCTION'
          if [ "$marker_status" -eq 0 ]; then
            if [ "$marker_output" != "$expected_marker_output" ]; then
              printf 'DEPLOY_TARGET_OUTPUT_MISMATCH\n' >&2
              exit 1
            fi
          else
            case "$marker_output" in
              DEPLOY_TARGET_IDENTITY_FAILED | \
              DEPLOY_TARGET_TRAVERSAL_FAILED | \
              DEPLOY_TARGET_FILE_TYPE_FAILED | \
              DEPLOY_TARGET_READABILITY_FAILED | \
              DEPLOY_TARGET_VALUE_COMPARISON_FAILED)
                printf '%s\n' "$marker_output" >&2
                ;;
              "" | "$expected_marker_output")
                printf 'DEPLOY_TARGET_SSH_STATUS_FAILED\n' >&2
                ;;
              *)
                printf 'DEPLOY_TARGET_OUTPUT_MISMATCH\n' >&2
                ;;
            esac
            exit 1
          fi
          printf 'FORWARD_REMOTE_IDENTITY_VALID\n'
          printf 'DEPLOY_TARGET_PRODUCTION\n'

          if ! ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" \
            'umask 077; mktemp -d /var/tmp/oasis-forward-deploy.XXXXXXXX' \
            >"$helper_dir_capture" 2>/dev/null; then
            printf 'FORWARD_HELPER_TRANSFER_FAILED\n' >&2
            exit 1
          fi
          remote_helper_dir="$(tr -d '\r\n' < "$helper_dir_capture")"
          [[ "$remote_helper_dir" =~ ^/var/tmp/oasis-forward-deploy\.[A-Za-z0-9]{8}$ ]] || {
            printf 'FORWARD_HELPER_TRANSFER_FAILED\n' >&2
            exit 1
          }
          printf 'REMOTE_HELPER_DIR=%s\n' "$remote_helper_dir" >> "$GITHUB_ENV"

          for helper in \
            deploy/v2/scripts/forward-deploy-state.mjs \
            deploy/v2/scripts/forward-deploy-recovery.sh \
            deploy/v2/scripts/legacy-bootstrap-state.mjs \
            deploy/v2/scripts/preflight-env.mjs \
            .github/workflows/revision-proof.mjs
          do
            if ! scp -q -i ~/.ssh/oasis_production_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              "$helper" \
              "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST:$remote_helper_dir/$(basename "$helper")" \
              >/dev/null 2>&1; then
              printf 'FORWARD_HELPER_TRANSFER_FAILED\n' >&2
              exit 1
            fi
          done
          if ! ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" \
            "[ \"\$(id -un 2>/dev/null)\" = deploy ] && chmod 700 '$remote_helper_dir/forward-deploy-recovery.sh'" \
            >/dev/null 2>&1; then
            printf 'FORWARD_HELPER_TRANSFER_FAILED\n' >&2
            exit 1
          fi
          printf 'FORWARD_HELPERS_STAGED\n'

      - name: Run approved forward deployment with allowlisted output only
        shell: bash
        run: |
          set -euo pipefail
          remote_output="$(mktemp)"
          chmod 600 "$remote_output"
          trap 'rm -f "$remote_output"' EXIT

          set +e
          timeout --foreground --signal=TERM --kill-after="${TRANSPORT_KILL_GRACE_SECONDS}s" "${TRANSPORT_TIMEOUT_SECONDS}s" \
            ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" \
            "TARGET_SHA='$TARGET_SHA' WORKFLOW_SHA='$WORKFLOW_SHA' ATTEMPT_ID='$ATTEMPT_ID' APP_URL='$OASIS_PRODUCTION_APP_URL' REPOSITORY='$GITHUB_REPOSITORY' HELPER_DIR='$REMOTE_HELPER_DIR' STATE_OPERATION_TIMEOUT_SECONDS='$STATE_OPERATION_TIMEOUT_SECONDS' FETCH_TIMEOUT_SECONDS='$FETCH_TIMEOUT_SECONDS' CHECKOUT_TIMEOUT_SECONDS='$CHECKOUT_TIMEOUT_SECONDS' PREFLIGHT_TIMEOUT_SECONDS='$PREFLIGHT_TIMEOUT_SECONDS' BUILD_TIMEOUT_SECONDS='$BUILD_TIMEOUT_SECONDS' DIAGNOSTIC_TIMEOUT_SECONDS='$DIAGNOSTIC_TIMEOUT_SECONDS' DIAGNOSTIC_FILE_READ_TIMEOUT_SECONDS='$DIAGNOSTIC_FILE_READ_TIMEOUT_SECONDS' REVISION_PROOF_TIMEOUT_SECONDS='$REVISION_PROOF_TIMEOUT_SECONDS' REPLACEMENT_TIMEOUT_SECONDS='$REPLACEMENT_TIMEOUT_SECONDS' ROLLBACK_TIMEOUT_SECONDS='$ROLLBACK_TIMEOUT_SECONDS' SHORT_KILL_GRACE_SECONDS='$SHORT_KILL_GRACE_SECONDS' PHASE_KILL_GRACE_SECONDS='$PHASE_KILL_GRACE_SECONDS' RECOVERY_LOCK_WAIT_SECONDS='$RECOVERY_LOCK_WAIT_SECONDS' RECOVERY_SUPERVISOR_HANDSHAKE_SECONDS='$RECOVERY_SUPERVISOR_HANDSHAKE_SECONDS' bash -se" \
            >"$remote_output" 2>&1 <<'REMOTE'
          set -euo pipefail
          umask 077

          fail_remote() {
            printf '%s\n' "$1"
            exit 1
          }

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || fail_remote FORWARD_INPUTS_INVALID
          [ "$TARGET_SHA" = "841b08e886446a7dbf019198b9c36426e245ee21" ] || fail_remote FORWARD_INPUTS_INVALID
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || fail_remote FORWARD_INPUTS_INVALID
          [[ "$ATTEMPT_ID" =~ ^[0-9a-f]{32}$ ]] || fail_remote FORWARD_INPUTS_INVALID
          [ "$REPOSITORY" = "welathfindrr13/oasis-care-international" ] || fail_remote FORWARD_INPUTS_INVALID
          [[ "$HELPER_DIR" =~ ^/var/tmp/oasis-forward-deploy\.[A-Za-z0-9]{8}$ ]] || fail_remote FORWARD_INPUTS_INVALID
          [ -d "$HELPER_DIR" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$STATE_OPERATION_TIMEOUT_SECONDS" = "15" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$FETCH_TIMEOUT_SECONDS" = "90" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$CHECKOUT_TIMEOUT_SECONDS" = "60" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$PREFLIGHT_TIMEOUT_SECONDS" = "60" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$BUILD_TIMEOUT_SECONDS" = "900" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$DIAGNOSTIC_TIMEOUT_SECONDS" = "10" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$DIAGNOSTIC_FILE_READ_TIMEOUT_SECONDS" = "2" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$REVISION_PROOF_TIMEOUT_SECONDS" = "30" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$REPLACEMENT_TIMEOUT_SECONDS" = "300" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$ROLLBACK_TIMEOUT_SECONDS" = "300" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$SHORT_KILL_GRACE_SECONDS" = "2" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$PHASE_KILL_GRACE_SECONDS" = "15" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$RECOVERY_LOCK_WAIT_SECONDS" = "2692" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$RECOVERY_SUPERVISOR_HANDSHAKE_SECONDS" = "10" ] || fail_remote FORWARD_INPUTS_INVALID
          [ "$(id -un 2>/dev/null)" = "deploy" ] || fail_remote FORWARD_REMOTE_IDENTITY_INVALID
          printf 'FORWARD_REMOTE_IDENTITY_VALID\n'

          forward_helper="$HELPER_DIR/forward-deploy-state.mjs"
          recovery_helper="$HELPER_DIR/forward-deploy-recovery.sh"
          legacy_helper="$HELPER_DIR/legacy-bootstrap-state.mjs"
          revision_helper="$HELPER_DIR/revision-proof.mjs"
          preflight_helper="$HELPER_DIR/preflight-env.mjs"
          binding_export="$HELPER_DIR/legacy-binding"
          caddy_override="$HELPER_DIR/caddy-override.yml"
          rollback_override="$HELPER_DIR/rollback-override.yml"
          recovery_result="$HELPER_DIR/recovery-result"
          recovery_ready="$HELPER_DIR/recovery-supervisor-ready"
          diagnostic_file="$(mktemp)"
          chmod 600 "$diagnostic_file"
          fetch_diagnostic_file="$HELPER_DIR/fetch-diagnostic.raw"
          failure_armed=0

          cleanup_remote() {
            timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" \
              rm -f "$diagnostic_file" "$binding_export" "$caddy_override" "$rollback_override" >/dev/null 2>&1 || true
          }

          safe_status() {
            printf '%s\n' "$1" 2>/dev/null || true
          }

          launch_recovery_supervisor() {
            [ -x "$recovery_helper" ] || return 1
            [ ! -e "$recovery_result" ] || return 1
            rm -f "$recovery_ready" || return 1
            nohup setsid -f env \
              TARGET_SHA="$TARGET_SHA" ATTEMPT_ID="$ATTEMPT_ID" APP_URL="$APP_URL" HELPER_DIR="$HELPER_DIR" \
              DIAGNOSTIC_TIMEOUT_SECONDS="$DIAGNOSTIC_TIMEOUT_SECONDS" REVISION_PROOF_TIMEOUT_SECONDS="$REVISION_PROOF_TIMEOUT_SECONDS" \
              STATE_OPERATION_TIMEOUT_SECONDS="$STATE_OPERATION_TIMEOUT_SECONDS" SHORT_KILL_GRACE_SECONDS="$SHORT_KILL_GRACE_SECONDS" \
              PHASE_KILL_GRACE_SECONDS="$PHASE_KILL_GRACE_SECONDS" ROLLBACK_TIMEOUT_SECONDS="$ROLLBACK_TIMEOUT_SECONDS" \
              RECOVERY_LOCK_WAIT_SECONDS="$RECOVERY_LOCK_WAIT_SECONDS" \
              bash "$recovery_helper" </dev/null >/dev/null 2>&1 9>&- || return 1
            local handshake_deadline=$((SECONDS + RECOVERY_SUPERVISOR_HANDSHAKE_SECONDS))
            while [ "$SECONDS" -lt "$handshake_deadline" ]; do
              if [ -f "$recovery_ready" ] && [ ! -L "$recovery_ready" ] && \
                [ "$(stat -c '%U:%G:%a' "$recovery_ready" 2>/dev/null)" = "$(id -un):$(id -gn):600" ] && \
                [ "$(tr -d '\r\n' < "$recovery_ready" 2>/dev/null)" = FORWARD_RECOVERY_SUPERVISOR_READY ]; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          handle_remote_exit() {
            local exit_status="$?"
            trap - EXIT HUP INT TERM
            if [ "$failure_armed" -eq 1 ]; then
              set +e
              recover_from_failure UNEXPECTED_FAILURE UNEXPECTED_EXIT
              set -e
            fi
            cleanup_remote
            exit "$exit_status"
          }

          trap 'handle_remote_exit' EXIT
          trap 'exit 1' HUP INT TERM

          target_class="$(tr -d '\r\n' < /etc/oasis/production-deploy-target-class 2>/dev/null)" || fail_remote DEPLOY_TARGET_UNKNOWN
          [ "$target_class" = "production" ] || fail_remote DEPLOY_TARGET_NOT_PRODUCTION
          printf 'DEPLOY_TARGET_PRODUCTION\n'

          cd /opt/oasis-care || fail_remote REPOSITORY_STATE_UNSAFE
          [ -d .git ] || fail_remote REPOSITORY_STATE_UNSAFE
          [ -z "$(git status --porcelain --untracked-files=all 2>/dev/null)" ] || fail_remote REPOSITORY_STATE_UNSAFE
          origin_url="$(git remote get-url origin 2>/dev/null)" || fail_remote REPOSITORY_STATE_UNSAFE
          case "$origin_url" in
            "https://github.com/${REPOSITORY}.git"|"git@github.com:${REPOSITORY}.git") ;;
            *) fail_remote REPOSITORY_STATE_UNSAFE ;;
          esac

          remote_main_line="$(git ls-remote --exit-code origin refs/heads/main 2>/dev/null)" || fail_remote FORWARD_TARGET_PROOF_FAILED
          remote_main="${remote_main_line%%[[:space:]]*}"
          [ "$remote_main" = "$WORKFLOW_SHA" ] || fail_remote FORWARD_TARGET_PROOF_FAILED

          git_common_raw="$(git rev-parse --git-common-dir 2>/dev/null)" || fail_remote REPOSITORY_STATE_UNSAFE
          git_common="$(cd "$git_common_raw" 2>/dev/null && pwd -P)" || fail_remote REPOSITORY_STATE_UNSAFE
          legacy_state_dir="$git_common/oasis-deploy/legacy-bootstrap-v1/state"
          forward_state_root="$git_common/oasis-deploy/forward-deployment-v1"
          exec 9>"$git_common/oasis-deploy/production-vps-mutation.lock"
          flock -n 9 || fail_remote PRODUCTION_MUTATION_LOCKED
          locked_target_class="$(tr -d '\r\n' < /etc/oasis/production-deploy-target-class 2>/dev/null)" || fail_remote DEPLOY_TARGET_UNKNOWN
          [ "$locked_target_class" = "production" ] || fail_remote DEPLOY_TARGET_NOT_PRODUCTION
          printf 'FORWARD_MUTATION_LOCK_ACQUIRED\n'

          LEGACY_STATE_DIR="$legacy_state_dir" LEGACY_STATE_HELPER="$legacy_helper" \
            FORWARD_BINDING_EXPORT="$binding_export" node "$forward_helper" inspect-legacy || exit 1
          declare -A legacy_values
          while IFS='=' read -r key value; do
            case "$key" in
              LEGACY_STATE_DIGEST|LEGACY_TARGET_SHA|LEGACY_ATTEMPT_ID|API_IMAGE_ID|API_IMAGE_ALIAS|WEB_IMAGE_ID|WEB_IMAGE_ALIAS|CADDY_IMAGE_ID|CADDY_IMAGE_ALIAS)
                [ -z "${legacy_values[$key]+x}" ] || fail_remote FORWARD_LEGACY_STATE_UNSAFE
                legacy_values["$key"]="$value"
                ;;
              *) fail_remote FORWARD_LEGACY_STATE_UNSAFE ;;
            esac
          done < "$binding_export"
          [ "${#legacy_values[@]}" -eq 9 ] || fail_remote FORWARD_LEGACY_STATE_UNSAFE
          [[ "${legacy_values[LEGACY_STATE_DIGEST]}" =~ ^[0-9a-f]{64}$ ]] || fail_remote FORWARD_LEGACY_STATE_UNSAFE
          [[ "${legacy_values[LEGACY_TARGET_SHA]}" =~ ^[0-9a-f]{40}$ ]] || fail_remote FORWARD_LEGACY_STATE_UNSAFE

          if ! OASIS_PRODUCTION_APP_URL="$APP_URL" TARGET_SHA="${legacy_values[LEGACY_TARGET_SHA]}" \
            node "$revision_helper" rollback_legacy; then
            fail_remote FORWARD_LEGACY_REVISION_UNSAFE
          fi

          compose=(docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml)
          declare -A running_images
          verify_rollback_aliases() {
            local service alias_key image_key alias_id
            for service in API WEB CADDY; do
              alias_key="${service}_IMAGE_ALIAS"
              image_key="${service}_IMAGE_ID"
              alias_id="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" docker image inspect --format '{{.Id}}' "${legacy_values[$alias_key]}" 2>/dev/null)" || return 1
              [ "$alias_id" = "${legacy_values[$image_key]}" ] || return 1
            done
          }

          service_state_category() {
            local service="$1" container_id details status health exit_code oom_killed
            container_id="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" "${compose[@]}" ps -q "$service" 2>/dev/null)" || {
              printf 'MISSING\n'
              return
            }
            if [[ ! "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
              printf 'MISSING\n'
              return
            fi
            details="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" docker inspect --format '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|{{.State.ExitCode}}|{{.State.OOMKilled}}' "$container_id" 2>/dev/null)" || {
              printf 'OTHER\n'
              return
            }
            IFS='|' read -r status health exit_code oom_killed <<< "$details"
            if [ "$oom_killed" = "true" ]; then
              printf 'OOM_KILLED\n'
            elif [ "$status" = "running" ] && [ "$health" = "healthy" ]; then
              printf 'RUNNING_HEALTHY\n'
            elif [ "$status" = "running" ]; then
              printf 'RUNNING_UNHEALTHY\n'
            elif [ "$status" = "exited" ] && [ "$exit_code" = "0" ]; then
              printf 'EXITED_ZERO\n'
            elif [ "$status" = "exited" ]; then
              printf 'EXITED_NONZERO\n'
            else
              printf 'OTHER\n'
            fi
          }

          service_log_category() {
            local service="$1" container_id log_material combined_material category
            container_id="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" "${compose[@]}" ps -q "$service" 2>/dev/null || true)"
            if [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
              log_material="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" docker logs --tail 200 "$container_id" 2>&1 || true)"
            else
              log_material=''
            fi
            combined_material="${diagnostic_material}"$'\n'"${log_material}"
            shopt -s nocasematch
            if [[ "$combined_material" =~ MODULE_NOT_FOUND|Cannot[[:space:]]+find[[:space:]]+module|module[[:space:]]+resolution ]]; then
              category='MODULE_RESOLUTION_FAILURE'
            elif [[ "$combined_material" =~ ECONNREFUSED|database.*(failed|error|unavailable)|postgres.*(failed|error|unavailable) ]]; then
              category='DATABASE_CONNECTION_FAILURE'
            elif [[ "$combined_material" =~ configuration|environment[[:space:]]+variable|invalid[[:space:]]+config|validation[[:space:]]+failed ]]; then
              category='CONFIGURATION_FAILURE'
            elif [[ "$combined_material" =~ /ready|health(check)?|unhealthy|dependency[[:space:]]+failed[[:space:]]+to[[:space:]]+start ]]; then
              category='READINESS_FAILURE'
            elif [ -s "$diagnostic_file" ] || [ -n "$log_material" ]; then
              category='NO_MATCH'
            else
              category='UNAVAILABLE'
            fi
            shopt -u nocasematch
            unset log_material combined_material
            printf '%s\n' "$category"
          }

          capture_sanitized_diagnostics() {
            diagnostic_material="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_FILE_READ_TIMEOUT_SECONDS}s" head -c 65536 "$diagnostic_file" 2>/dev/null || true)"
            api_state_category="$(service_state_category api)"
            web_state_category="$(service_state_category web)"
            caddy_state_category="$(service_state_category caddy)"
            api_log_category="$(service_log_category api)"
            web_log_category="$(service_log_category web)"
            caddy_log_category="$(service_log_category caddy)"
            unset diagnostic_material
          }

          persist_failure_evidence() {
            local failure_class="$1" failure_phase="$2"
            timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
              env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" \
              FAILURE_CLASS="$failure_class" FAILURE_PHASE="$failure_phase" \
              API_STATE_CATEGORY="$api_state_category" WEB_STATE_CATEGORY="$web_state_category" CADDY_STATE_CATEGORY="$caddy_state_category" \
              API_LOG_CATEGORY="$api_log_category" WEB_LOG_CATEGORY="$web_log_category" CADDY_LOG_CATEGORY="$caddy_log_category" \
              node "$forward_helper" record-evidence >"$diagnostic_file" 2>&1 || return 1
            safe_status FORWARD_FAILURE_EVIDENCE_RECORDED
            return 0
          }

          fetch_diagnostic_is_persisted() {
            local fetch_state
            fetch_state="$(
              timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
                env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" \
                node "$forward_helper" inspect-fetch 2>"$diagnostic_file"
            )" || return 1
            [ "$fetch_state" = FORWARD_FETCH_DIAGNOSTIC_PRESENT ]
          }

          rollback_legacy_runtime() {
            local service container_id health_status running_image image_key postgres_container postgres_health
            verify_rollback_aliases || return 1
            timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" \
              bash -c 'printf "services:\n  api:\n    image: %s\n  web:\n    image: %s\n  caddy:\n    image: %s\n" "$2" "$3" "$4" > "$1" && chmod 600 "$1"' \
              bash "$rollback_override" "${legacy_values[API_IMAGE_ALIAS]}" "${legacy_values[WEB_IMAGE_ALIAS]}" "${legacy_values[CADDY_IMAGE_ALIAS]}" || return 1
            rollback_compose=(docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml -f "$rollback_override")
            if ! timeout --foreground --signal=TERM --kill-after="${PHASE_KILL_GRACE_SECONDS}s" "${ROLLBACK_TIMEOUT_SECONDS}s" \
              env RUN_MIGRATIONS=false MEDICATION_EMAR_ENABLED=false \
              APP_COMMIT_SHA="${legacy_values[LEGACY_TARGET_SHA]}" APP_VERSION="${legacy_values[LEGACY_TARGET_SHA]:0:12}" \
              "${rollback_compose[@]}" up -d --no-deps --no-build --pull never --wait --wait-timeout 180 api web caddy \
              >"$diagnostic_file" 2>&1; then
              return 1
            fi
            for service in api web caddy; do
              container_id="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" "${rollback_compose[@]}" ps -q "$service" 2>/dev/null)" || return 1
              [[ "$container_id" =~ ^[0-9a-f]{64}$ ]] || return 1
              health_status="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null)" || return 1
              [ "$health_status" = "healthy" ] || return 1
              running_image="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" docker inspect --format '{{.Image}}' "$container_id" 2>/dev/null)" || return 1
              image_key="${service^^}_IMAGE_ID"
              [ "$running_image" = "${legacy_values[$image_key]}" ] || return 1
            done
            postgres_container="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" "${rollback_compose[@]}" ps -q postgres 2>/dev/null)" || return 1
            [[ "$postgres_container" =~ ^[0-9a-f]{64}$ ]] || return 1
            postgres_health="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" docker inspect --format '{{.State.Health.Status}}' "$postgres_container" 2>/dev/null)" || return 1
            [ "$postgres_health" = "healthy" ] || return 1
            verify_rollback_aliases || return 1
            timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${REVISION_PROOF_TIMEOUT_SECONDS}s" \
              env OASIS_PRODUCTION_APP_URL="$APP_URL" TARGET_SHA="${legacy_values[LEGACY_TARGET_SHA]}" \
              node "$revision_helper" rollback_legacy >"$diagnostic_file" 2>&1 || return 1
            timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
              env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" \
              LEGACY_STATE_DIR="$legacy_state_dir" LEGACY_STATE_HELPER="$legacy_helper" \
              node "$forward_helper" verify-legacy >"$diagnostic_file" 2>&1 || return 1
            verify_rollback_aliases || return 1
            safe_status FORWARD_ROLLBACK_COMPLETE
            return 0
          }

          recover_from_failure() {
            local failure_class="$1" failure_phase="$2" state_recorded=0 next_state=RECOVERABLE_FAILURE
            trap - HUP INT TERM
            failure_armed=0
            capture_sanitized_diagnostics
            if [ "$failure_class" != CHECKOUT_FAILED ] && fetch_diagnostic_is_persisted; then
              failure_class=CHECKOUT_FAILED
              failure_phase=CHECKOUT
            fi
            if [ "$failure_class" = COMPLETION_STATE_UNCERTAIN ]; then
              next_state=COMPLETION_UNCERTAIN
            fi
            if timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
              env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" \
              NEXT_STATE="$next_state" FAILURE_CLASS="$failure_class" \
              node "$forward_helper" transition >/dev/null 2>&1; then
              state_recorded=1
              safe_status "FORWARD_STATE_${next_state}"
              if ! persist_failure_evidence "$failure_class" "$failure_phase"; then
                safe_status FORWARD_STATE_IO_UNCERTAIN
              fi
            else
              safe_status FORWARD_STATE_IO_UNCERTAIN
            fi
            if rollback_legacy_runtime; then
              :
            else
              safe_status FORWARD_ROLLBACK_FAILED
            fi
            [ "$state_recorded" -eq 1 ] || safe_status FORWARD_RECOVERY_STATE_UNCERTAIN
            safe_status FORWARD_RECOVERY_REQUIRED
            return 1
          }

          verify_rollback_aliases || fail_remote FORWARD_ROLLBACK_IMAGES_UNSAFE

          for service in api web caddy; do
            container_id="$("${compose[@]}" ps -q "$service" 2>/dev/null)" || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
            [[ "$container_id" =~ ^[0-9a-f]{64}$ ]] || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
            health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null)" || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
            [ "$health_status" = "healthy" ] || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
            running_image="$(docker inspect --format '{{.Image}}' "$container_id" 2>/dev/null)" || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
            image_key="${service^^}_IMAGE_ID"
            [ "$running_image" = "${legacy_values[$image_key]}" ] || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
            running_images["$service"]="$running_image"
          done
          postgres_container="$("${compose[@]}" ps -q postgres 2>/dev/null)" || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
          [[ "$postgres_container" =~ ^[0-9a-f]{64}$ ]] || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
          postgres_health="$(docker inspect --format '{{.State.Health.Status}}' "$postgres_container" 2>/dev/null)" || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE
          [ "$postgres_health" = "healthy" ] || fail_remote FORWARD_RUNNING_IMAGES_UNSAFE

          if ! node "$preflight_helper" deploy/v2/.env >"$diagnostic_file" 2>&1; then
            fail_remote FORWARD_PREFLIGHT_FAILED
          fi
          RUNNING_API_IMAGE_ID="${running_images[api]}" \
            RUNNING_WEB_IMAGE_ID="${running_images[web]}" \
            RUNNING_CADDY_IMAGE_ID="${running_images[caddy]}" \
            FORWARD_STATE_ROOT="$forward_state_root" TARGET_SHA="$TARGET_SHA" WORKFLOW_SHA="$WORKFLOW_SHA" ATTEMPT_ID="$ATTEMPT_ID" \
            ORIGIN_MAIN_SHA="$WORKFLOW_SHA" REPOSITORY="$REPOSITORY" \
            LEGACY_STATE_DIR="$legacy_state_dir" LEGACY_STATE_HELPER="$legacy_helper" \
            EXPECTED_LEGACY_STATE_DIGEST="${legacy_values[LEGACY_STATE_DIGEST]}" \
            node "$forward_helper" prepare || exit 1
          verify_rollback_aliases || fail_remote FORWARD_ROLLBACK_IMAGES_UNSAFE
          launch_recovery_supervisor || fail_remote FORWARD_RECOVERY_SUPERVISOR_FAILED
          printf 'FORWARD_RECOVERY_SUPERVISOR_ARMED\n'

          record_recoverable_failure() {
            local failure_class="$1" failure_phase="$2"
            recover_from_failure "$failure_class" "$failure_phase" || true
            exit 1
          }

          failure_armed=1
          timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
            env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" NEXT_STATE=MUTATION_STARTED \
            node "$forward_helper" transition || exit 1

          bounded_git_fetch() {
            [ ! -e "$fetch_diagnostic_file" ] || return 125
            (umask 077; : > "$fetch_diagnostic_file") || return 125
            chmod 600 "$fetch_diagnostic_file" || return 125
            timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${FETCH_TIMEOUT_SECONDS}s" \
              git fetch --no-tags origin main >/dev/null 2>"$fetch_diagnostic_file"
          }

          classify_fetch_status() {
            case "$1" in
              124|137|143) safe_status FORWARD_FETCH_TIMEOUT ;;
              *) safe_status FORWARD_FETCH_FAILED ;;
            esac
          }

          persist_fetch_diagnostic() {
            local fetch_status="$1" classification_output='' classified_status='' classified_category='' line
            classification_output="$(
              timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
                env FETCH_DIAGNOSTIC_FILE="$fetch_diagnostic_file" FETCH_EXIT_STATUS="$fetch_status" \
                node "$forward_helper" classify-fetch 2>"$diagnostic_file"
            )" || return 1
            while IFS= read -r line; do
              case "$line" in
                FETCH_EXIT_STATUS=*)
                  [ -z "$classified_status" ] || return 1
                  classified_status="${line#FETCH_EXIT_STATUS=}"
                  ;;
                FETCH_ERROR_CATEGORY=*)
                  [ -z "$classified_category" ] || return 1
                  classified_category="${line#FETCH_ERROR_CATEGORY=}"
                  ;;
                *) return 1 ;;
              esac
            done <<< "$classification_output"
            [ "$classified_status" = "$fetch_status" ] || return 1
            case "$classified_category" in
              FETCH_TIMEOUT|FETCH_TERMINATED|FETCH_AUTHENTICATION|FETCH_DNS|FETCH_TLS|FETCH_NETWORK|FETCH_REMOTE_REF|FETCH_PACK_TRANSFER|FETCH_PACK_FINALIZATION|FETCH_OBJECT_CORRUPTION|FETCH_REF_LOCK|FETCH_DISK|FETCH_INODE|FETCH_UNKNOWN) ;;
              *) return 1 ;;
            esac
            timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
              env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" \
              FETCH_EXIT_STATUS="$classified_status" FETCH_ERROR_CATEGORY="$classified_category" \
              node "$forward_helper" record-fetch-diagnostic >"$diagnostic_file" 2>&1 || return 1
            rm -f -- "$fetch_diagnostic_file" || return 1
            safe_status FORWARD_FETCH_DIAGNOSTIC_RECORDED
            safe_status "FORWARD_FETCH_CATEGORY_${classified_category}"
          }

          set +e
          bounded_git_fetch
          fetch_status=$?
          set -e
          if [ "$fetch_status" -ne 0 ]; then
            if ! persist_fetch_diagnostic "$fetch_status"; then
              safe_status FORWARD_FETCH_DIAGNOSTIC_PERSISTENCE_FAILED
            fi
            classify_fetch_status "$fetch_status"
            record_recoverable_failure CHECKOUT_FAILED CHECKOUT
          fi
          rm -f -- "$fetch_diagnostic_file" || record_recoverable_failure CHECKOUT_FAILED CHECKOUT

          if ! timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${CHECKOUT_TIMEOUT_SECONDS}s" \
            bash -c '
              set -euo pipefail
              fetched_main="$(git rev-parse origin/main 2>/dev/null)"
              [ "$fetched_main" = "$1" ]
              git cat-file -e "${2}^{commit}" 2>/dev/null
              git merge-base --is-ancestor "$2" "$1" >"$3" 2>&1
              git checkout --detach "$2" >"$3" 2>&1
            ' bash "$WORKFLOW_SHA" "$TARGET_SHA" "$diagnostic_file"; then
            record_recoverable_failure CHECKOUT_FAILED CHECKOUT
          fi

          if ! timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${PREFLIGHT_TIMEOUT_SECONDS}s" \
            bash -c '
              set -euo pipefail
              node deploy/v2/scripts/preflight-env.mjs deploy/v2/.env >"$1" 2>&1
              run_migrations="$(awk -F= '\''$0 !~ /^[[:space:]]*#/ && $1 == "RUN_MIGRATIONS" {v=substr($0,index($0,"=")+1)} END {gsub(/^[[:space:]]+|[[:space:]]+$/,"",v); print v}'\'' deploy/v2/.env 2>/dev/null)"
              [ "$run_migrations" = false ]
              printf "services:\n  caddy:\n    image: %s\n" "$3" > "$2"
              chmod 600 "$2"
            ' bash "$diagnostic_file" "$caddy_override" "${legacy_values[CADDY_IMAGE_ALIAS]}"; then
            record_recoverable_failure PREFLIGHT_FAILED PREFLIGHT
          fi
          compose=(docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml -f "$caddy_override")
          verify_rollback_aliases || record_recoverable_failure LEGACY_STATE_CHANGED LEGACY_STATE
          if ! timeout --foreground --signal=TERM --kill-after="${PHASE_KILL_GRACE_SECONDS}s" "${BUILD_TIMEOUT_SECONDS}s" \
            env RUN_MIGRATIONS=false MEDICATION_EMAR_ENABLED=false APP_COMMIT_SHA="$TARGET_SHA" APP_VERSION="${TARGET_SHA:0:12}" \
            "${compose[@]}" build web api >"$diagnostic_file" 2>&1; then
            record_recoverable_failure BUILD_FAILED BUILD
          fi
          verify_rollback_aliases || record_recoverable_failure LEGACY_STATE_CHANGED LEGACY_STATE

          if ! timeout --foreground --signal=TERM --kill-after="${PHASE_KILL_GRACE_SECONDS}s" "${REPLACEMENT_TIMEOUT_SECONDS}s" \
            env RUN_MIGRATIONS=false MEDICATION_EMAR_ENABLED=false APP_COMMIT_SHA="$TARGET_SHA" APP_VERSION="${TARGET_SHA:0:12}" \
            "${compose[@]}" up -d --no-deps --no-build --pull never --wait --wait-timeout 180 api web caddy \
            >"$diagnostic_file" 2>&1; then
            record_recoverable_failure RUNTIME_REPLACEMENT_FAILED RUNTIME_REPLACEMENT
          fi
          for service in api web caddy; do
            container_id="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" "${compose[@]}" ps -q "$service" 2>/dev/null)" || record_recoverable_failure CONTAINER_HEALTH_FAILED CONTAINER_HEALTH
            health_status="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null)" || record_recoverable_failure CONTAINER_HEALTH_FAILED CONTAINER_HEALTH
            [ "$health_status" = "healthy" ] || record_recoverable_failure CONTAINER_HEALTH_FAILED CONTAINER_HEALTH
            if [ "$service" = "caddy" ]; then
              running_image="$(timeout --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${DIAGNOSTIC_TIMEOUT_SECONDS}s" docker inspect --format '{{.Image}}' "$container_id" 2>/dev/null)" || record_recoverable_failure CONTAINER_HEALTH_FAILED CONTAINER_HEALTH
              [ "$running_image" = "${legacy_values[CADDY_IMAGE_ID]}" ] || record_recoverable_failure LEGACY_STATE_CHANGED LEGACY_STATE
            fi
          done
          verify_rollback_aliases || record_recoverable_failure LEGACY_STATE_CHANGED LEGACY_STATE
          if ! timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${REVISION_PROOF_TIMEOUT_SECONDS}s" \
            env OASIS_PRODUCTION_APP_URL="$APP_URL" TARGET_SHA="$TARGET_SHA" \
            node "$revision_helper" target_exact; then
            record_recoverable_failure REVISION_PROOF_FAILED REVISION_PROOF
          fi
          if ! timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
            env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" \
            LEGACY_STATE_DIR="$legacy_state_dir" LEGACY_STATE_HELPER="$legacy_helper" \
            node "$forward_helper" verify-legacy; then
            record_recoverable_failure LEGACY_STATE_CHANGED LEGACY_STATE
          fi
          verify_rollback_aliases || record_recoverable_failure LEGACY_STATE_CHANGED LEGACY_STATE
          set +e
          timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
            env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" NEXT_STATE=COMPLETE \
            node "$forward_helper" transition >"$diagnostic_file" 2>&1
          completion_transition_status=$?
          set -e
          completion_state="$(timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
            env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" \
            node "$forward_helper" adjudicate-completion 2>"$diagnostic_file")" || \
            record_recoverable_failure COMPLETION_STATE_UNCERTAIN COMPLETION
          if [ "$completion_state" != FORWARD_STATE_COMPLETE ]; then
            record_recoverable_failure COMPLETION_STATE_UNCERTAIN COMPLETION
          fi
          if ! timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${REVISION_PROOF_TIMEOUT_SECONDS}s" \
            env OASIS_PRODUCTION_APP_URL="$APP_URL" TARGET_SHA="$TARGET_SHA" \
            node "$revision_helper" target_exact >"$diagnostic_file" 2>&1; then
            record_recoverable_failure COMPLETION_STATE_UNCERTAIN COMPLETION
          fi
          if ! timeout --foreground --signal=TERM --kill-after="${SHORT_KILL_GRACE_SECONDS}s" "${STATE_OPERATION_TIMEOUT_SECONDS}s" \
            env FORWARD_STATE_ROOT="$forward_state_root" ATTEMPT_ID="$ATTEMPT_ID" \
            LEGACY_STATE_DIR="$legacy_state_dir" LEGACY_STATE_HELPER="$legacy_helper" \
            node "$forward_helper" verify-legacy >"$diagnostic_file" 2>&1; then
            record_recoverable_failure COMPLETION_STATE_UNCERTAIN COMPLETION
          fi
          verify_rollback_aliases || record_recoverable_failure COMPLETION_STATE_UNCERTAIN COMPLETION
          [ "$completion_transition_status" -eq 0 ] || printf 'FORWARD_COMPLETION_ADJUDICATED\n'
          failure_armed=0
          printf 'FORWARD_STATE_COMPLETE\n'
          printf 'FORWARD_DEPLOY_COMPLETE\n'
          REMOTE
          remote_status=$?
          set -e

          recovery_result_is_conclusively_safe() {
            case "$1" in
              FORWARD_RECOVERY_COMPLETE_VERIFIED|FORWARD_RECOVERY_LEGACY_VERIFIED|FORWARD_RECOVERY_NO_MUTATION) return 0 ;;
              *) return 1 ;;
            esac
          }

          recovery_helper_cleanup_is_safe() {
            local recovery_result="$1" diagnostic_persistence_failed="$2"
            [ "$diagnostic_persistence_failed" -eq 0 ] || return 1
            recovery_result_is_conclusively_safe "$recovery_result"
          }

          unsafe_output=0
          diagnostic_persistence_failed=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              FORWARD_INPUTS_INVALID|FORWARD_TARGET_PROOF_FAILED|FORWARD_REMOTE_IDENTITY_VALID|FORWARD_REMOTE_IDENTITY_INVALID|DEPLOY_TARGET_PRODUCTION|DEPLOY_TARGET_UNKNOWN|DEPLOY_TARGET_NOT_PRODUCTION|REPOSITORY_STATE_UNSAFE|PRODUCTION_MUTATION_LOCKED|FORWARD_MUTATION_LOCK_ACQUIRED|FORWARD_LEGACY_START_VALID|FORWARD_LEGACY_STATE_UNSAFE|FORWARD_LEGACY_REVISION_UNSAFE|FORWARD_RUNNING_IMAGES_UNSAFE|FORWARD_ROLLBACK_IMAGES_UNSAFE|FORWARD_PREFLIGHT_FAILED|FORWARD_FETCH_TIMEOUT|FORWARD_FETCH_FAILED|FORWARD_FETCH_DIAGNOSTIC_RECORDED|FORWARD_FETCH_CATEGORY_FETCH_TIMEOUT|FORWARD_FETCH_CATEGORY_FETCH_TERMINATED|FORWARD_FETCH_CATEGORY_FETCH_AUTHENTICATION|FORWARD_FETCH_CATEGORY_FETCH_DNS|FORWARD_FETCH_CATEGORY_FETCH_TLS|FORWARD_FETCH_CATEGORY_FETCH_NETWORK|FORWARD_FETCH_CATEGORY_FETCH_REMOTE_REF|FORWARD_FETCH_CATEGORY_FETCH_PACK_TRANSFER|FORWARD_FETCH_CATEGORY_FETCH_PACK_FINALIZATION|FORWARD_FETCH_CATEGORY_FETCH_OBJECT_CORRUPTION|FORWARD_FETCH_CATEGORY_FETCH_REF_LOCK|FORWARD_FETCH_CATEGORY_FETCH_DISK|FORWARD_FETCH_CATEGORY_FETCH_INODE|FORWARD_FETCH_CATEGORY_FETCH_UNKNOWN|FORWARD_STATE_PREPARED|FORWARD_STATE_MUTATION_STARTED|FORWARD_STATE_RECOVERABLE_FAILURE|FORWARD_STATE_COMPLETION_UNCERTAIN|FORWARD_STATE_COMPLETE|FORWARD_STATE_ALREADY_CONSUMED|FORWARD_STATE_LOCKED|FORWARD_STATE_INVALID|FORWARD_STATE_IO_UNCERTAIN|FORWARD_FAILURE_EVIDENCE_RECORDED|FORWARD_ROLLBACK_COMPLETE|FORWARD_ROLLBACK_FAILED|FORWARD_RECOVERY_SUPERVISOR_ARMED|FORWARD_COMPLETION_ADJUDICATED|FORWARD_RECOVERY_STATE_UNCERTAIN|FORWARD_RECOVERY_REQUIRED|FORWARD_LEGACY_STATE_UNCHANGED|LEGACY_UNKNOWN|REVISION_AWARE_EXACT|REVISION_UNSAFE|FORWARD_DEPLOY_COMPLETE)
                printf '%s\n' "$line"
                ;;
              FORWARD_FETCH_DIAGNOSTIC_PERSISTENCE_FAILED)
                diagnostic_persistence_failed=1
                printf '%s\n' "$line"
                ;;
              *)
                unsafe_output=1
                ;;
            esac
          done < "$remote_output"

          case "$remote_status" in
            124|137|143)
              printf 'FORWARD_TRANSPORT_TIMEOUT\n' >&2
              ;;
          esac

          recovery_result=''
          recovery_deadline=$((SECONDS + RECOVERY_RECONNECT_TIMEOUT_SECONDS))
          while [ "$SECONDS" -lt "$recovery_deadline" ]; do
            set +e
            recovery_probe="$(timeout --foreground --signal=TERM --kill-after=15s 45s \
              ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" \
              "set -e; [ \"\$(id -un 2>/dev/null)\" = deploy ]; [ -d '$REMOTE_HELPER_DIR' ] && [ ! -L '$REMOTE_HELPER_DIR' ]; if [ -f '$REMOTE_HELPER_DIR/recovery-result' ] && [ ! -L '$REMOTE_HELPER_DIR/recovery-result' ]; then [ \"\$(stat -c '%U:%G:%a' '$REMOTE_HELPER_DIR/recovery-result' 2>/dev/null)\" = deploy:deploy:600 ]; cat '$REMOTE_HELPER_DIR/recovery-result'; exit 0; fi; [ -x '$REMOTE_HELPER_DIR/forward-deploy-recovery.sh' ]; nohup setsid -f env TARGET_SHA='$TARGET_SHA' ATTEMPT_ID='$ATTEMPT_ID' APP_URL='$OASIS_PRODUCTION_APP_URL' HELPER_DIR='$REMOTE_HELPER_DIR' DIAGNOSTIC_TIMEOUT_SECONDS='$DIAGNOSTIC_TIMEOUT_SECONDS' REVISION_PROOF_TIMEOUT_SECONDS='$REVISION_PROOF_TIMEOUT_SECONDS' STATE_OPERATION_TIMEOUT_SECONDS='$STATE_OPERATION_TIMEOUT_SECONDS' SHORT_KILL_GRACE_SECONDS='$SHORT_KILL_GRACE_SECONDS' PHASE_KILL_GRACE_SECONDS='$PHASE_KILL_GRACE_SECONDS' ROLLBACK_TIMEOUT_SECONDS='$ROLLBACK_TIMEOUT_SECONDS' RECOVERY_LOCK_WAIT_SECONDS='$RECOVERY_LOCK_WAIT_SECONDS' bash '$REMOTE_HELPER_DIR/forward-deploy-recovery.sh' </dev/null >/dev/null 2>&1 9>&-; printf 'FORWARD_RECOVERY_PENDING\n'" \
              2>/dev/null)"
            recovery_probe_status=$?
            set -e
            if [ "$recovery_probe_status" -eq 0 ]; then
              case "$recovery_probe" in
                FORWARD_RECOVERY_COMPLETE_VERIFIED|FORWARD_RECOVERY_LEGACY_VERIFIED|FORWARD_RECOVERY_LEGACY_VERIFIED_STATE_UNCERTAIN|FORWARD_RECOVERY_NO_MUTATION|FORWARD_RECOVERY_ROLLBACK_FAILED|FORWARD_RECOVERY_STATE_UNCERTAIN|FORWARD_RECOVERY_SUPERVISOR_FAILED)
                  recovery_result="$recovery_probe"
                  break
                  ;;
                FORWARD_RECOVERY_PENDING) ;;
                *) unsafe_output=1 ;;
              esac
            fi
            sleep 5
          done

          if [ -n "$recovery_result" ]; then
            printf '%s\n' "$recovery_result"
            if recovery_helper_cleanup_is_safe "$recovery_result" "$diagnostic_persistence_failed"; then
              ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
                "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" \
                "[ \"\$(id -un 2>/dev/null)\" = deploy ] && case '$REMOTE_HELPER_DIR' in /var/tmp/oasis-forward-deploy.*) rm -rf -- '$REMOTE_HELPER_DIR' ;; *) exit 1 ;; esac" \
                >/dev/null 2>&1 || true
            else
              printf 'FORWARD_RECOVERY_HELPERS_PRESERVED\n'
            fi
          else
            printf 'FORWARD_RECOVERY_RECONNECT_FAILED\n' >&2
          fi

          if [ "$unsafe_output" -ne 0 ]; then
            printf 'REMOTE_OUTPUT_UNSAFE\n' >&2
            exit 1
          fi
          if [ "$recovery_result" = FORWARD_RECOVERY_COMPLETE_VERIFIED ]; then
            exit 0
          fi
          if [ "$remote_status" -ne 0 ] || [ "$recovery_result" != FORWARD_RECOVERY_COMPLETE_VERIFIED ]; then
            printf 'FORWARD_REMOTE_OPERATION_FAILED\n' >&2
            exit 1
          fi
