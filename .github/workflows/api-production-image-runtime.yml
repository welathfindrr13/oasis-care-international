name: API production image runtime verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/api-production-image-runtime.yml'
      - 'apps/api/**'
      - 'libs/auth/**'
      - 'libs/db/**'
      - 'libs/time/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

permissions:
  contents: read

concurrency:
  group: api-production-image-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-image-runtime:
    name: Build and probe exact API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request head without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build exact production API image
        shell: bash
        run: |
          set -euo pipefail
          image="oasis-api-ci:${SOURCE_SHA}"
          docker build \
            --build-arg "APP_COMMIT_SHA=${SOURCE_SHA}" \
            --build-arg "APP_VERSION=${SOURCE_SHA}" \
            --file apps/api/Dockerfile \
            --tag "$image" \
            .

          baked_sha="$(
            docker image inspect \
              --format '{{range .Config.Env}}{{println .}}{{end}}' \
              "$image" | sed -n 's/^APP_COMMIT_SHA=//p'
          )"
          test "$baked_sha" = "$SOURCE_SHA"
          printf 'EXACT_HEAD_IMAGE=PASS\n'

      - name: Prove production workspace dependencies resolve at runtime
        shell: bash
        run: |
          set -euo pipefail
          image="oasis-api-ci:${SOURCE_SHA}"
          docker run --rm \
            --network none \
            --read-only \
            --user 1001:1001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 64 \
            --memory 512m \
            --entrypoint node \
            "$image" \
            -e "for (const name of ['@oasis/auth', '@oasis/db', '@oasis/time']) require(name); console.log('WORKSPACE_RUNTIME_RESOLUTION=PASS')"
