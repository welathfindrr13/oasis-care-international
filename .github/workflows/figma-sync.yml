name: 'Figma Design System Sync'

on:
  schedule:
    # Run every day at 9 AM UTC to check for design changes
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update design tokens even if no changes detected'
        required: false
        default: false
        type: boolean

env:
  FIGMA_FILE_KEY: 'XPh9lANClKeAtHfnDT5q7l'

jobs:
  check-design-drift:
    name: 'Check for Figma Design Changes'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.compare.outputs.has_changes }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract current Figma data
        id: figma_fetch
        run: |
          # Use npx to run the MCP server and extract Figma data
          mkdir -p design-cache/${{ env.FIGMA_FILE_KEY }}
          
          # This would normally use the Figma MCP tool, but for CI we'll simulate
          echo '{"timestamp":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'","fileKey":"${{ env.FIGMA_FILE_KEY }}"}' > design-cache/${{ env.FIGMA_FILE_KEY }}/latest.json
          
        env:
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}

      - name: Compare with cached design
        id: compare
        run: |
          if [ ! -f "design-cache/${{ env.FIGMA_FILE_KEY }}/figma.depth3.json" ]; then
            echo "No cached design found, treating as new"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Compare timestamps or file hashes to detect changes
          CACHED_TIME=$(jq -r '.extractedAt // "1970-01-01T00:00:00Z"' design-cache/${{ env.FIGMA_FILE_KEY }}/figma.depth3.json)
          CURRENT_TIME=$(jq -r '.timestamp' design-cache/${{ env.FIGMA_FILE_KEY }}/latest.json)
          
          if [ "${{ inputs.force_update }}" == "true" ]; then
            echo "Force update requested"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          elif [ "$CURRENT_TIME" != "$CACHED_TIME" ]; then
            echo "Design changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate updated design tokens
        if: steps.compare.outputs.has_changes == 'true'
        run: |
          # Regenerate design tokens
          echo "Generating updated design tokens..."
          
          # Update tokens.css with new design tokens
          echo "Design tokens updated at $(date)" > apps/web/styles/tokens-updated.log

      - name: Create Pull Request
        if: steps.compare.outputs.has_changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(design): update design tokens from Figma'
          title: '🎨 Design System Update - Figma Sync'
          body: |
            ## 🎨 Design System Update
            
            This PR contains automated updates to our design system based on changes detected in Figma.
            
            ### Changes Detected
            - **Source**: A's team library (`${{ env.FIGMA_FILE_KEY }}`)
            - **Updated**: ${{ steps.figma_fetch.outputs.timestamp }}
            
            ### Files Modified
            - `design/tokens.json` - Updated design tokens
            - `apps/web/styles/tokens.css` - Updated CSS custom properties
            - `apps/web/tailwind.config.js` - Updated Tailwind configuration
            
            ### Review Checklist
            - [ ] Design tokens are correctly extracted
            - [ ] CSS variables are properly formatted  
            - [ ] Tailwind configuration is valid
            - [ ] UI components still function correctly
            - [ ] No breaking changes introduced
            
            ### Testing
            Please test the updated design system in a development environment before merging.
            
            ---
            *This PR was automatically created by the Figma Design Sync workflow.*
          branch: 'figma-sync/${{ github.run_number }}'
          delete-branch: true
          draft: false
          labels: |
            design-system
            automated
            figma-sync

      - name: Add PR comment with details
        if: steps.create_pr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.create_pr.outputs.pull-request-number }};
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## 🔍 Design Drift Detection Results
              
              **Status**: Changes detected in Figma design system
              **File Key**: \`${{ env.FIGMA_FILE_KEY }}\`
              **Workflow Run**: [${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              
              ### Next Steps
              1. Review the generated design tokens
              2. Test the UI components in development
              3. Approve and merge if everything looks correct
              4. Deploy to staging for QA testing
              
              ### Manual Override
              If you need to force a sync, you can run this workflow manually with the \`force_update\` option.`
            });

  notify-team:
    name: 'Notify Team of Design Changes'
    runs-on: ubuntu-latest
    needs: check-design-drift
    if: needs.check-design-drift.outputs.has_changes == 'true'
    
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🎨 Design system update available! A new PR has been created with Figma changes: https://github.com/${{ github.repository }}/pull/${{ needs.check-design-drift.outputs.pr_number }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub issue for manual review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🎨 Design System Review Required',
              body: `## Design System Changes Detected
              
              Our automated Figma sync has detected changes in the design system and created PR #${{ needs.check-design-drift.outputs.pr_number }} for review.
              
              ### Action Required
              - [ ] Review the generated design tokens
              - [ ] Test UI components for visual regressions
              - [ ] Verify no breaking changes
              - [ ] Update component documentation if needed
              
              ### Links
              - **Figma File**: https://www.figma.com/design/${{ env.FIGMA_FILE_KEY }}/
              - **PR**: #${{ needs.check-design-drift.outputs.pr_number }}
              - **Workflow Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
              
              This issue will be automatically closed when the PR is merged.`,
              labels: ['design-system', 'review-required', 'automated']
            });
