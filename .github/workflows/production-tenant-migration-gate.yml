name: Production Tenant Migration Gate

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: Expected production /opt/oasis-care git SHA.
        required: true
        type: string
      production_migration_approval:
        description: Exact approval token for the tenant organization NOT NULL migration.
        required: true
        type: string

concurrency:
  group: production-vps-mutation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MIGRATION_NAME: 20260707090000_tenant_organization_not_null
  MIGRATION_PATH: libs/db/prisma/migrations/20260707090000_tenant_organization_not_null/migration.sql
  REQUIRED_APPROVAL_TOKEN: APPROVE_20260707090000_TENANT_ORGANIZATION_NOT_NULL_PRODUCTION

jobs:
  production-migration-gate:
    name: Gate production tenant migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed workflow commit
        uses: actions/checkout@v3

      - name: Validate production SSH secrets and approval inputs
        shell: bash
        env:
          OASIS_PRODUCTION_VPS_HOST: ${{ secrets.OASIS_PRODUCTION_VPS_HOST }}
          OASIS_PRODUCTION_VPS_USER: ${{ secrets.OASIS_PRODUCTION_VPS_USER }}
          OASIS_PRODUCTION_VPS_SSH_KEY: ${{ secrets.OASIS_PRODUCTION_VPS_SSH_KEY }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          PRODUCTION_MIGRATION_APPROVAL: ${{ inputs.production_migration_approval }}
          REQUIRED_APPROVAL_TOKEN: ${{ env.REQUIRED_APPROVAL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$OASIS_PRODUCTION_VPS_HOST" ] || [ -z "$OASIS_PRODUCTION_VPS_USER" ] || [ -z "$OASIS_PRODUCTION_VPS_SSH_KEY" ]; then
            printf 'PRODUCTION_SSH_SECRETS_UNKNOWN\n' >&2
            exit 1
          fi
          if [ -z "$EXPECTED_PRODUCTION_SHA" ]; then
            printf 'PRODUCTION_CODE_SHA_UNKNOWN\n' >&2
            exit 1
          fi
          if [ "$PRODUCTION_MIGRATION_APPROVAL" != "$REQUIRED_APPROVAL_TOKEN" ]; then
            printf 'PRODUCTION_MIGRATION_APPROVAL_MISMATCH\n' >&2
            exit 1
          fi

      - name: Configure production SSH
        shell: bash
        env:
          OASIS_PRODUCTION_VPS_HOST: ${{ secrets.OASIS_PRODUCTION_VPS_HOST }}
          OASIS_PRODUCTION_VPS_SSH_KEY: ${{ secrets.OASIS_PRODUCTION_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OASIS_PRODUCTION_VPS_SSH_KEY" > ~/.ssh/oasis_production_vps
          chmod 600 ~/.ssh/oasis_production_vps
          ssh-keyscan -H "$OASIS_PRODUCTION_VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Gate approved production migration
        shell: bash
        env:
          OASIS_PRODUCTION_VPS_HOST: ${{ secrets.OASIS_PRODUCTION_VPS_HOST }}
          OASIS_PRODUCTION_VPS_USER: ${{ secrets.OASIS_PRODUCTION_VPS_USER }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          PRODUCTION_MIGRATION_APPROVAL: ${{ inputs.production_migration_approval }}
          REQUIRED_APPROVAL_TOKEN: ${{ env.REQUIRED_APPROVAL_TOKEN }}
          MIGRATION_NAME: ${{ env.MIGRATION_NAME }}
          MIGRATION_PATH: ${{ env.MIGRATION_PATH }}
        run: |
          set -euo pipefail

          test -f scripts/release/tenant-nullability-dry-run.mjs
          MIGRATION_GATE_APPROVED=""

          validate_tenant_report() {
            local report_file="$1"
            local status="$2"
            local phase="$3"
            local sanitized_report=""
            local sanitized_report_lines=0
            local unallowlisted_output=0
            local malformed_count_line=0
            local saw_header=0
            local saw_no_data_changed=0

            if [ ! -s "$report_file" ]; then
              printf 'Tenant nullability dry-run diagnostic class: empty report output.\n' >&2
              printf 'Tenant nullability dry-run failed before report generation.\n' >&2
              return 1
            fi

            if grep -Eiq '://|bearer|secret|token|cookie|jwt|authorization|password|[[:alnum:]_.%+-]+@[[:alnum:].-]+' "$report_file"; then
              printf 'Tenant nullability dry-run rejected output class: unsafe pattern.\n' >&2
              printf 'Tenant nullability dry-run failed with unsafe output suppressed.\n' >&2
              return 1
            fi

            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                "")
                  ;;
                "Tenant nullability dry-run")
                  saw_header=1
                  sanitized_report="${sanitized_report}${line}"$'\n'
                  sanitized_report_lines=$((sanitized_report_lines + 1))
                  ;;
                "Excluded models: AuditLog")
                  sanitized_report="${sanitized_report}${line}"$'\n'
                  sanitized_report_lines=$((sanitized_report_lines + 1))
                  ;;
                "No data changed.")
                  saw_no_data_changed=1
                  sanitized_report="${sanitized_report}${line}"$'\n'
                  sanitized_report_lines=$((sanitized_report_lines + 1))
                  ;;
                *": null organization_id rows = "*)
                  if [[ "$line" =~ ^[A-Za-z]+[[:space:]]\([a-z_]+\):[[:space:]]null[[:space:]]organization_id[[:space:]]rows[[:space:]]=[[:space:]][0-9]+$ ]]; then
                    sanitized_report="${sanitized_report}${line}"$'\n'
                    sanitized_report_lines=$((sanitized_report_lines + 1))
                  else
                    malformed_count_line=1
                  fi
                  ;;
                *)
                  unallowlisted_output=1
                  ;;
              esac
            done < "$report_file"

            if [ "$malformed_count_line" -ne 0 ]; then
              printf 'Tenant nullability dry-run rejected output class: malformed count line.\n' >&2
              printf 'Tenant nullability dry-run failed with unsafe output suppressed.\n' >&2
              return 1
            fi

            if [ "$unallowlisted_output" -ne 0 ]; then
              printf 'Tenant nullability dry-run rejected output class: unallowlisted line.\n' >&2
              printf 'Tenant nullability dry-run failed with unsafe output suppressed.\n' >&2
              return 1
            fi

            if [ "$saw_header" -ne 1 ]; then
              printf 'Tenant nullability dry-run diagnostic class: report missing required header.\n' >&2
              printf 'Tenant nullability dry-run failed before report generation.\n' >&2
              return 1
            fi

            if [ "$saw_no_data_changed" -ne 1 ]; then
              printf 'Tenant nullability dry-run diagnostic class: report missing completion marker.\n' >&2
              printf 'Tenant nullability dry-run failed before report generation.\n' >&2
              return 1
            fi

            if [ "$sanitized_report_lines" -eq 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: empty report output.\n' >&2
              printf 'Tenant nullability dry-run failed before report generation.\n' >&2
              return 1
            fi

            printf 'TENANT_NULLABILITY_DRY_RUN_REPORT_START\n'
            printf '%s' "$sanitized_report"
            printf 'TENANT_NULLABILITY_DRY_RUN_REPORT_END\n'

            if [ "$status" -eq 0 ]; then
              printf 'PASS: tenant nullability eligible-table gate passed.\n'
              printf 'TENANT_NULLABILITY_%s_PASS\n' "$phase"
              return 0
            fi

            printf 'FAIL: tenant nullability eligible-table gate failed.\n' >&2
            printf 'TENANT_NULLABILITY_%s_FAILED\n' "$phase" >&2
            return 1
          }

          run_tenant_dry_run() {
            local phase="$1"
            local report_file
            local diagnostic_file
            local remote_script_dir=""
            report_file="$(mktemp)"
            diagnostic_file="$(mktemp)"

            cleanup_dry_run() {
              if [ -n "${remote_script_dir:-}" ]; then
                ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" "chmod u+w '$remote_script_dir' 2>/dev/null || true; rm -rf '$remote_script_dir'" >/dev/null 2>> "$diagnostic_file" || true
              fi
              rm -f "$report_file" "$diagnostic_file"
              trap - RETURN
            }
            trap cleanup_dry_run RETURN

            remote_script_dir="$(ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'mktemp -d' 2>> "$diagnostic_file")"
            scp -i ~/.ssh/oasis_production_vps -o BatchMode=yes scripts/release/tenant-nullability-dry-run.mjs "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST:$remote_script_dir/tenant-nullability-dry-run.mjs" 2>> "$diagnostic_file"
            ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" "chmod 0444 '$remote_script_dir/tenant-nullability-dry-run.mjs'; chmod 0555 '$remote_script_dir'" 2>> "$diagnostic_file"

            set +e
            ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'bash -se' -- "$remote_script_dir" <<'REMOTE' > "$report_file" 2>> "$diagnostic_file"
          set -euo pipefail
          remote_script_dir="$1"
          cd /opt/oasis-care
          remote_tmp="$(mktemp -d)"
          trap 'rm -rf "$remote_tmp"' EXIT

          if ! docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml config --quiet >/dev/null 2>> "$remote_tmp/transport.err"; then
            exit 1
          fi

          api_container_id="$(docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml ps -q api 2>> "$remote_tmp/transport.err" || true)"
          if [ -z "$api_container_id" ]; then
            exit 1
          fi

          if ! docker inspect -f '{{.State.Running}}' "$api_container_id" 2>> "$remote_tmp/transport.err" | grep -qx true; then
            exit 1
          fi

          set +e
          docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml exec -T api sh -lc '
              set -u
              container_work_dir="$(mktemp -d /tmp/tenant-nullability-work.XXXXXX)" || exit 1
              mkdir -p "$container_work_dir/scripts/release" || { rm -rf "$container_work_dir"; exit 1; }
              ln -s /app/libs "$container_work_dir/libs" || { rm -rf "$container_work_dir"; exit 1; }
              container_script_file="$container_work_dir/scripts/release/tenant-nullability-dry-run.mjs"
              cat > "$container_script_file" || { rm -rf "$container_work_dir"; exit 1; }
              chmod 0444 "$container_script_file" || { rm -rf "$container_work_dir"; exit 1; }
              container_report_file="$(mktemp /tmp/tenant-nullability-report.XXXXXX)" || { rm -rf "$container_work_dir"; exit 1; }
              set +e
              node "$container_script_file" --fail-on-null --exclude AuditLog > "$container_report_file"
              node_status="$?"
              set -e
              rm -rf "$container_work_dir"
              if [ -s "$container_report_file" ]; then
                cat "$container_report_file"
              fi
              rm -f "$container_report_file"
              exit "$node_status"
            ' < "$remote_script_dir/tenant-nullability-dry-run.mjs" > "$remote_tmp/report.out" 2> "$remote_tmp/transport.err"
          status=$?
          set -e
          if [ -s "$remote_tmp/report.out" ]; then
            cat "$remote_tmp/report.out"
          fi
          exit "$status"
          REMOTE
            status=$?
            set -e

            validate_tenant_report "$report_file" "$status" "$phase"
          }

          run_remote_gate() {
            ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'bash -se' -- "$EXPECTED_PRODUCTION_SHA" "$MIGRATION_PATH" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          migration_path="$2"
          target_class="$(tr -d '\r\n' < /etc/oasis/production-deploy-target-class 2>/dev/null || true)"
          if [ "$target_class" = "production" ]; then
            printf 'DEPLOY_TARGET_PRODUCTION\n'
          elif [ -z "$target_class" ]; then
            printf 'DEPLOY_TARGET_UNKNOWN\n' >&2
            exit 1
          else
            printf 'DEPLOY_TARGET_NOT_PRODUCTION\n' >&2
            exit 1
          fi

          cd /opt/oasis-care
          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" = "$expected_sha" ]; then
            printf 'PRODUCTION_CODE_SHA_OK\n'
          else
            printf 'PRODUCTION_CODE_SHA_MISMATCH\n' >&2
            exit 1
          fi

          if test -f libs/db/prisma/migrations/20260707090000_tenant_organization_not_null/migration.sql && test -f "$migration_path"; then
            printf 'MIGRATION_FILE_PRESENT\n'
          else
            printf 'MIGRATION_FILE_MISSING\n' >&2
            exit 1
          fi
          REMOTE
          }

          prove_pending_migration_set() {
            local proof_file
            local diagnostic_file
            MIGRATION_GATE_APPROVED=""
            proof_file="$(mktemp)"
            diagnostic_file="$(mktemp)"
            trap 'rm -f "$proof_file" "$diagnostic_file"; trap - RETURN' RETURN

            set +e
            ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'bash -se' -- "$MIGRATION_NAME" <<'REMOTE' > "$proof_file" 2>> "$diagnostic_file"
          set -euo pipefail
          MIGRATION_NAME="$1"
          cd /opt/oasis-care
          remote_tmp="$(mktemp -d)"
          trap 'rm -rf "$remote_tmp"' EXIT

          set +e
          docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml exec -T api sh -lc '
            set -eu
            MIGRATION_NAME="$1"
            if ! cd /app/libs/db; then
              printf "PRISMA_WORKDIR_INVALID\n"
              printf "PENDING_MIGRATION_WORKDIR_INVALID\n"
              exit 1
            fi
            printf "PRISMA_WORKDIR_OK\n"
            if [ ! -f prisma/schema.prisma ]; then
              printf "PENDING_MIGRATION_SCHEMA_MISSING\n"
              exit 1
            fi
            if [ ! -d prisma/migrations ]; then
              printf "PENDING_MIGRATION_DIR_MISSING\n"
              exit 1
            fi
            if [ ! -f "prisma/migrations/$MIGRATION_NAME/migration.sql" ]; then
              printf "PENDING_MIGRATION_FILE_NOT_VISIBLE\n"
              exit 1
            fi
            if ! command -v npx >/dev/null 2>&1; then
              printf "PENDING_MIGRATION_NPX_UNAVAILABLE\n"
              exit 1
            fi
            if ! npx --no-install prisma --version >/dev/null 2>&1; then
              printf "PRISMA_CLI_UNAVAILABLE\n"
              printf "PENDING_MIGRATION_PRISMA_UNAVAILABLE\n"
              exit 1
            fi
            printf "PRISMA_CLI_AVAILABLE\n"
            status_file="$(mktemp /tmp/production-migration-status.XXXXXX)"
            set +e
            npx prisma migrate status --schema prisma/schema.prisma > "$status_file" 2>&1
            status="$?"
            set -e
            if [ ! -s "$status_file" ]; then
              printf "PENDING_MIGRATION_STATUS_EMPTY\n"
              rm -f "$status_file"
              exit 1
            fi
            if grep -Eiq "://|bearer|secret|token|cookie|jwt|authorization|password|[[:alnum:]_.%+-]+@[[:alnum:].-]+" "$status_file"; then
              printf "PENDING_MIGRATION_STATUS_UNSAFE\n"
              rm -f "$status_file"
              exit 1
            fi
            if grep -Eiq "migration history.*diverg|histories.*diverg|failed migration|modified after.*applied" "$status_file"; then
              printf "PENDING_MIGRATION_HISTORY_DIVERGED\n"
              rm -f "$status_file"
              exit 1
            fi
            if [ "$status" -eq 127 ]; then
              printf "PENDING_MIGRATION_PRISMA_UNAVAILABLE\n"
              rm -f "$status_file"
              exit 1
            fi
            pending_header_found=0
            expected_name_found=0
            if grep -Eiq "following migration.*not yet been applied" "$status_file"; then
              pending_header_found=1
            fi
            if grep -Fq "$MIGRATION_NAME" "$status_file"; then
              expected_name_found=1
            fi
            expected_line_count="$(grep -Ec "^[[:space:]]*$MIGRATION_NAME[[:space:]]*$" "$status_file" || true)"
            migration_line_count="$(grep -Ec "^[[:space:]]*[0-9]+_[A-Za-z0-9_]+[[:space:]]*$" "$status_file" || true)"

            if [ "$status" -eq 1 ] && [ "$pending_header_found" -eq 1 ] && [ "$expected_name_found" -eq 1 ] && [ "$expected_line_count" -eq 1 ] && [ "$migration_line_count" -eq 1 ]; then
              printf "%s\n" "$MIGRATION_NAME"
              rm -f "$status_file"
              exit 0
            fi
            if [ "$status" -eq 0 ]; then
              printf "PRISMA_MIGRATION_STATUS_UP_TO_DATE\n"
              rm -f "$status_file"
              exit 0
            fi
            if [ "$pending_header_found" -eq 1 ] && [ "$migration_line_count" -gt 1 ]; then
              printf "PENDING_MIGRATION_SET_MULTIPLE\n"
              rm -f "$status_file"
              exit 1
            fi
            if [ "$pending_header_found" -eq 1 ] && [ "$expected_name_found" -eq 1 ] && [ "$expected_line_count" -ne 1 ]; then
              printf "PENDING_MIGRATION_STATUS_UNPARSEABLE\n"
              rm -f "$status_file"
              exit 1
            fi
            if [ "$pending_header_found" -eq 1 ] && [ "$migration_line_count" -eq 0 ]; then
              printf "PENDING_MIGRATION_SET_UNKNOWN\n"
              rm -f "$status_file"
              exit 1
            fi
            if [ "$status" -ne 0 ]; then
              printf "PENDING_MIGRATION_STATUS_NONZERO_NO_PARSE\n"
              rm -f "$status_file"
              exit 1
            fi
            rm -f "$status_file"
          ' sh "$MIGRATION_NAME" > "$remote_tmp/pending.out" 2> "$remote_tmp/transport.err" < /dev/null
          pending_command_status=$?
          set -e

          if [ "$pending_command_status" -eq 127 ]; then
            printf 'PENDING_MIGRATION_COMMAND_UNAVAILABLE\n'
            exit 1
          fi

          if [ ! -s "$remote_tmp/pending.out" ]; then
            printf 'PENDING_MIGRATION_STATUS_EMPTY\n'
            exit 1
          fi

          if grep -Eiq '://|bearer|secret|token|cookie|jwt|authorization|password|[[:alnum:]_.%+-]+@[[:alnum:].-]+' "$remote_tmp/pending.out"; then
            printf 'PENDING_MIGRATION_SET_UNSAFE\n'
            exit 1
          fi

          grep -Ev '^(PRISMA_WORKDIR_OK|PRISMA_CLI_AVAILABLE)$' "$remote_tmp/pending.out" > "$remote_tmp/pending.filtered" || true
          mv "$remote_tmp/pending.filtered" "$remote_tmp/pending.out"

          if grep -Eq '^PENDING_MIGRATION_(COMMAND_UNAVAILABLE|NPX_UNAVAILABLE|PRISMA_UNAVAILABLE|WORKDIR_INVALID|SCHEMA_MISSING|DIR_MISSING|FILE_NOT_VISIBLE|STATUS_EMPTY|STATUS_NONZERO_NO_PARSE|STATUS_UNSAFE|STATUS_UNPARSEABLE|HISTORY_DIVERGED|SET_MULTIPLE|SET_UNKNOWN)$' "$remote_tmp/pending.out"; then
            grep -E '^PENDING_MIGRATION_(COMMAND_UNAVAILABLE|NPX_UNAVAILABLE|PRISMA_UNAVAILABLE|WORKDIR_INVALID|SCHEMA_MISSING|DIR_MISSING|FILE_NOT_VISIBLE|STATUS_EMPTY|STATUS_NONZERO_NO_PARSE|STATUS_UNSAFE|STATUS_UNPARSEABLE|HISTORY_DIVERGED|SET_MULTIPLE|SET_UNKNOWN)$' "$remote_tmp/pending.out"
            exit 1
          fi

          pending_name="$(grep -E '^[0-9]+_[A-Za-z0-9_]+$' "$remote_tmp/pending.out" | head -n 1 || true)"
          pending_count="$(grep -Ec '^[0-9]+_[A-Za-z0-9_]+$' "$remote_tmp/pending.out" || true)"

          if grep -qx 'PRISMA_MIGRATION_STATUS_UP_TO_DATE' "$remote_tmp/pending.out" && [ "$pending_count" -eq 0 ]; then
            printf 'PENDING_MIGRATION_SET_ZERO\n'
            exit 1
          fi

          if [ "$pending_count" -eq 1 ] && [ "$pending_name" = "$MIGRATION_NAME" ]; then
            printf 'PENDING_MIGRATION_SET_EXACT: %s\n' "$MIGRATION_NAME"
            exit 0
          fi

          if [ "$pending_count" -eq 0 ]; then
            printf 'PENDING_MIGRATION_SET_UNKNOWN\n'
            exit 1
          fi

          printf 'PENDING_MIGRATION_SET_MULTIPLE\n'
          exit 1
          REMOTE
            status=$?
            set -e

            if grep -Eiq '://|bearer|secret|token|cookie|jwt|authorization|password|[[:alnum:]_.%+-]+@[[:alnum:].-]+' "$proof_file"; then
              printf 'PENDING_MIGRATION_SET_UNSAFE\n' >&2
              return 1
            fi

            if grep -Eq '^PENDING_MIGRATION_SET_EXACT: 20260707090000_tenant_organization_not_null$' "$proof_file"; then
              printf 'PENDING_MIGRATION_SET_EXACT: %s\n' "$MIGRATION_NAME"
              MIGRATION_GATE_APPROVED="20260707090000_tenant_organization_not_null"
              return 0
            fi

            if grep -Eq '^PENDING_MIGRATION_(COMMAND_UNAVAILABLE|NPX_UNAVAILABLE|PRISMA_UNAVAILABLE|WORKDIR_INVALID|SCHEMA_MISSING|DIR_MISSING|FILE_NOT_VISIBLE|STATUS_EMPTY|STATUS_NONZERO_NO_PARSE|STATUS_UNSAFE|STATUS_UNPARSEABLE|HISTORY_DIVERGED|SET_ZERO|SET_MULTIPLE|SET_UNKNOWN|SET_UNSAFE)$' "$proof_file"; then
              grep -E '^PENDING_MIGRATION_(COMMAND_UNAVAILABLE|NPX_UNAVAILABLE|PRISMA_UNAVAILABLE|WORKDIR_INVALID|SCHEMA_MISSING|DIR_MISSING|FILE_NOT_VISIBLE|STATUS_EMPTY|STATUS_NONZERO_NO_PARSE|STATUS_UNSAFE|STATUS_UNPARSEABLE|HISTORY_DIVERGED|SET_ZERO|SET_MULTIPLE|SET_UNKNOWN|SET_UNSAFE)$' "$proof_file" >&2
              return 1
            fi

            printf 'PENDING_MIGRATION_SET_UNKNOWN\n' >&2
            return 1
          }

          run_single_migration() {
            local result_file
            local diagnostic_file
            result_file="$(mktemp)"
            diagnostic_file="$(mktemp)"
            trap 'rm -f "$result_file" "$diagnostic_file"; trap - RETURN' RETURN

            if [ "$PRODUCTION_MIGRATION_APPROVAL" != "$REQUIRED_APPROVAL_TOKEN" ]; then
              printf 'PRODUCTION_MIGRATION_APPROVAL_MISMATCH\n' >&2
              return 1
            fi

            if [ "${MIGRATION_GATE_APPROVED:-}" != "20260707090000_tenant_organization_not_null" ]; then
              printf 'MIGRATION_GATE_NOT_APPROVED\n' >&2
              return 1
            fi

            printf 'MIGRATION_PRODUCTION_STARTED: %s\n' "$MIGRATION_NAME"
            set +e
            ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'bash -se' <<'REMOTE' > "$result_file" 2>> "$diagnostic_file"
          set -euo pipefail
          cd /opt/oasis-care
          remote_tmp="$(mktemp -d)"
          trap 'rm -rf "$remote_tmp"' EXIT

          docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml exec -T api sh -lc '
            set -eu
            cd /app/libs/db
            deploy_file="$(mktemp /tmp/production-migration-deploy.XXXXXX)"
            set +e
            npx prisma migrate deploy --schema prisma/schema.prisma > "$deploy_file" 2>&1
            status="$?"
            set -e
            rm -f "$deploy_file"
            exit "$status"
          ' > "$remote_tmp/deploy.out" 2> "$remote_tmp/transport.err" < /dev/null
          REMOTE
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              printf 'MIGRATION_PRODUCTION_SUCCEEDED: %s\n' "$MIGRATION_NAME"
              return 0
            fi

            if [ "$status" -eq 127 ]; then
              printf 'MIGRATION_PRODUCTION_COMMAND_UNAVAILABLE\n' >&2
              return "$status"
            fi

            printf 'MIGRATION_PRODUCTION_FAILED\n' >&2
            return "$status"
          }

          prove_migration_applied() {
            local status_file
            local diagnostic_file
            status_file="$(mktemp)"
            diagnostic_file="$(mktemp)"
            trap 'rm -f "$status_file" "$diagnostic_file"; trap - RETURN' RETURN

            set +e
            ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'bash -se' -- "$MIGRATION_NAME" <<'REMOTE' > "$status_file" 2>> "$diagnostic_file"
          set -euo pipefail
          migration_name="$1"
          cd /opt/oasis-care
          remote_tmp="$(mktemp -d)"
          trap 'rm -rf "$remote_tmp"' EXIT

          docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml exec -T api sh -lc '
            set -eu
            cd /app/libs/db
            status_file="$(mktemp /tmp/production-migration-status.XXXXXX)"
            set +e
            npx prisma migrate status --schema prisma/schema.prisma > "$status_file" 2>&1
            status="$?"
            set -e
            if [ "$status" -eq 0 ]; then
              printf "PRISMA_MIGRATION_STATUS_UP_TO_DATE\n"
            fi
            rm -f "$status_file"
            exit "$status"
          ' > "$remote_tmp/status.out" 2> "$remote_tmp/transport.err" < /dev/null

          if grep -qx 'PRISMA_MIGRATION_STATUS_UP_TO_DATE' "$remote_tmp/status.out"; then
            printf 'MIGRATION_STATUS_APPLIED: %s\n' "$migration_name"
            exit 0
          fi

          printf 'MIGRATION_STATUS_UNKNOWN\n'
          exit 1
          REMOTE
            status=$?
            set -e

            if grep -Eq '^MIGRATION_STATUS_APPLIED: 20260707090000_tenant_organization_not_null$' "$status_file"; then
              printf 'MIGRATION_STATUS_APPLIED: %s\n' "$MIGRATION_NAME"
              return 0
            fi

            printf 'MIGRATION_STATUS_UNKNOWN\n' >&2
            return "$status"
          }

          run_remote_gate
          run_tenant_dry_run pre
          prove_pending_migration_set
          run_single_migration
          prove_migration_applied
          run_tenant_dry_run post
