name: Tenant Nullability Dry Run

on:
  workflow_dispatch:

concurrency:
  group: tenant-nullability-dry-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Run staging eligible-table null tenant gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate SSH secrets
        shell: bash
        env:
          OASIS_VPS_HOST: ${{ secrets.OASIS_VPS_HOST }}
          OASIS_VPS_USER: ${{ secrets.OASIS_VPS_USER }}
          OASIS_VPS_SSH_KEY: ${{ secrets.OASIS_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$OASIS_VPS_HOST"
          test -n "$OASIS_VPS_USER"
          test -n "$OASIS_VPS_SSH_KEY"

      - name: Configure SSH
        shell: bash
        env:
          OASIS_VPS_HOST: ${{ secrets.OASIS_VPS_HOST }}
          OASIS_VPS_SSH_KEY: ${{ secrets.OASIS_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OASIS_VPS_SSH_KEY" > ~/.ssh/oasis_vps
          chmod 600 ~/.ssh/oasis_vps
          ssh-keyscan -H "$OASIS_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run fixed tenant nullability gate
        shell: bash
        env:
          OASIS_VPS_HOST: ${{ secrets.OASIS_VPS_HOST }}
          OASIS_VPS_USER: ${{ secrets.OASIS_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oasis_vps -o BatchMode=yes "$OASIS_VPS_USER@$OASIS_VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/oasis-care
          test -f scripts/release/tenant-nullability-dry-run.mjs

          set +e
          report="$(
            docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml run --rm --no-deps --entrypoint node \
              -v "$PWD/scripts/release:/app/scripts/release:ro" \
              api /app/scripts/release/tenant-nullability-dry-run.mjs --fail-on-null --exclude AuditLog
          )"
          status=$?
          set -e

          if printf '%s\n' "$report" | grep -Eiq '://|bearer|secret|token|cookie|jwt|authorization|password|[[:alnum:]_.%+-]+@[[:alnum:].-]+'; then
            printf 'Unsafe tenant nullability dry-run output; refusing to print report.\n' >&2
            exit 1
          fi

          printf '%s\n' "$report" | while IFS= read -r line; do
            case "$line" in
              "Tenant nullability dry-run"|"Excluded models: AuditLog"|"No data changed.")
                printf '%s\n' "$line"
                ;;
              *"("*"): null organization_id rows = "*)
                if printf '%s\n' "$line" | grep -Eq '^[A-Za-z]+ \([a-z_]+\): null organization_id rows = [0-9]+$'; then
                  printf '%s\n' "$line"
                else
                  printf 'Unsafe tenant nullability dry-run output; refusing to print report.\n' >&2
                  exit 1
                fi
                ;;
              *)
                printf 'Unsafe tenant nullability dry-run output; refusing to print report.\n' >&2
                exit 1
                ;;
            esac
          done

          if [ "$status" -eq 0 ]; then
            printf 'PASS: tenant nullability eligible-table gate passed.\n'
          else
            printf 'FAIL: tenant nullability eligible-table gate failed.\n' >&2
          fi

          exit "$status"
          REMOTE
