name: Tenant Nullability Dry Run

on:
  workflow_dispatch:

concurrency:
  group: tenant-nullability-dry-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Run production eligible-table null tenant gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed workflow commit
        uses: actions/checkout@v3

      - name: Validate SSH secrets
        shell: bash
        env:
          OASIS_PRODUCTION_VPS_HOST: ${{ secrets.OASIS_PRODUCTION_VPS_HOST }}
          OASIS_PRODUCTION_VPS_USER: ${{ secrets.OASIS_PRODUCTION_VPS_USER }}
          OASIS_PRODUCTION_VPS_SSH_KEY: ${{ secrets.OASIS_PRODUCTION_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$OASIS_PRODUCTION_VPS_HOST"
          test -n "$OASIS_PRODUCTION_VPS_USER"
          test -n "$OASIS_PRODUCTION_VPS_SSH_KEY"

      - name: Configure SSH
        shell: bash
        env:
          OASIS_PRODUCTION_VPS_HOST: ${{ secrets.OASIS_PRODUCTION_VPS_HOST }}
          OASIS_PRODUCTION_VPS_SSH_KEY: ${{ secrets.OASIS_PRODUCTION_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OASIS_PRODUCTION_VPS_SSH_KEY" > ~/.ssh/oasis_production_vps
          chmod 600 ~/.ssh/oasis_production_vps
          ssh-keyscan -H "$OASIS_PRODUCTION_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run fixed tenant nullability gate
        shell: bash
        env:
          OASIS_PRODUCTION_VPS_HOST: ${{ secrets.OASIS_PRODUCTION_VPS_HOST }}
          OASIS_PRODUCTION_VPS_USER: ${{ secrets.OASIS_PRODUCTION_VPS_USER }}
        run: |
          set -euo pipefail
          report_file="$(mktemp)"
          diagnostic_file="$(mktemp)"
          remote_script_dir=""

          cleanup() {
            if [ -n "${remote_script_dir:-}" ]; then
              ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" "chmod u+w '$remote_script_dir' 2>/dev/null || true; rm -rf '$remote_script_dir'" >/dev/null 2>> "$diagnostic_file" || true
            fi
            rm -f "$report_file" "$diagnostic_file"
          }
          trap cleanup EXIT

          test -f scripts/release/tenant-nullability-dry-run.mjs
          ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          target_class="$(tr -d '\r\n' < /etc/oasis/production-deploy-target-class 2>/dev/null || true)"
          if [ "$target_class" = "production" ]; then
            printf 'TENANT_NULLABILITY_TARGET_PRODUCTION\n'
          elif [ -z "$target_class" ]; then
            printf 'TENANT_NULLABILITY_TARGET_UNKNOWN\n' >&2
            exit 1
          else
            printf 'TENANT_NULLABILITY_TARGET_NOT_PRODUCTION\n' >&2
            exit 1
          fi
          REMOTE
          remote_script_dir="$(ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'mktemp -d' 2>> "$diagnostic_file")"
          scp -i ~/.ssh/oasis_production_vps -o BatchMode=yes scripts/release/tenant-nullability-dry-run.mjs "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST:$remote_script_dir/tenant-nullability-dry-run.mjs" 2>> "$diagnostic_file"
          ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" "chmod 0444 '$remote_script_dir/tenant-nullability-dry-run.mjs'" 2>> "$diagnostic_file"
          ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" "chmod 0555 '$remote_script_dir'" 2>> "$diagnostic_file"

          set +e
          ssh -i ~/.ssh/oasis_production_vps -o BatchMode=yes "$OASIS_PRODUCTION_VPS_USER@$OASIS_PRODUCTION_VPS_HOST" 'bash -se' -- "$remote_script_dir" <<'REMOTE' > "$report_file" 2>> "$diagnostic_file"
          set -euo pipefail
          remote_script_dir="$1"
          printf 'TENANT_NULLABILITY_DIAGNOSTIC: remote command started\n'
          cd /opt/oasis-care
          remote_tmp="$(mktemp -d)"
          trap 'rm -rf "$remote_tmp"' EXIT

          if ! command -v docker >/dev/null 2>&1; then
            printf 'TENANT_NULLABILITY_DIAGNOSTIC: docker unavailable\n'
            exit 127
          fi

          if ! docker compose version >/dev/null 2>&1; then
            printf 'TENANT_NULLABILITY_DIAGNOSTIC: docker compose unavailable\n'
            exit 127
          fi

          if ! docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml config --quiet >/dev/null 2>> "$remote_tmp/transport.err"; then
            printf 'TENANT_NULLABILITY_DIAGNOSTIC: docker compose config failed\n'
            exit 1
          fi

          api_container_id="$(docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml ps -q api 2>> "$remote_tmp/transport.err" || true)"
          if [ -z "$api_container_id" ]; then
            printf 'TENANT_NULLABILITY_DIAGNOSTIC: api container unavailable\n'
            exit 1
          fi

          if ! docker inspect -f '{{.State.Running}}' "$api_container_id" >/dev/null 2>> "$remote_tmp/transport.err"; then
            printf 'TENANT_NULLABILITY_DIAGNOSTIC: api container unavailable\n'
            exit 1
          fi

          if ! docker inspect -f '{{.State.Running}}' "$api_container_id" 2>> "$remote_tmp/transport.err" | grep -qx true; then
            printf 'TENANT_NULLABILITY_DIAGNOSTIC: api container unavailable\n'
            exit 1
          fi

          printf 'TENANT_NULLABILITY_DIAGNOSTIC: docker command starting\n'
          set +e
          docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml exec -T api sh -lc '
              set -u
              printf "TENANT_NULLABILITY_DIAGNOSTIC: container command started\n"
              container_work_dir="$(mktemp -d /tmp/tenant-nullability-work.XXXXXX)" || {
                printf "TENANT_NULLABILITY_DIAGNOSTIC: container script staging failed\n"
                exit 1
              }

              if ! mkdir -p "$container_work_dir/scripts/release"; then
                printf "TENANT_NULLABILITY_DIAGNOSTIC: container script staging failed\n"
                rm -rf "$container_work_dir"
                exit 1
              fi

              if ! ln -s /app/libs "$container_work_dir/libs"; then
                printf "TENANT_NULLABILITY_DIAGNOSTIC: container script staging failed\n"
                rm -rf "$container_work_dir"
                exit 1
              fi

              container_script_file="$container_work_dir/scripts/release/tenant-nullability-dry-run.mjs"
              if ! cat > "$container_script_file"; then
                printf "TENANT_NULLABILITY_DIAGNOSTIC: container script staging failed\n"
                rm -rf "$container_work_dir"
                exit 1
              fi

              if ! chmod 0444 "$container_script_file"; then
                printf "TENANT_NULLABILITY_DIAGNOSTIC: container script staging failed\n"
                rm -rf "$container_work_dir"
                exit 1
              fi

              container_report_file="$(mktemp /tmp/tenant-nullability-report.XXXXXX)" || {
                printf "TENANT_NULLABILITY_DIAGNOSTIC: node command produced empty report\n"
                rm -rf "$container_work_dir"
                exit 1
              }

              printf "TENANT_NULLABILITY_DIAGNOSTIC: node command started\n"
              set +e
              node "$container_script_file" --fail-on-null --exclude AuditLog > "$container_report_file"
              node_status="$?"
              set -e
              rm -rf "$container_work_dir"
              printf "TENANT_NULLABILITY_DIAGNOSTIC: node command exited status=%s\n" "$node_status"

              if [ -s "$container_report_file" ]; then
                printf "TENANT_NULLABILITY_DIAGNOSTIC: container report cat attempted\n"
                cat "$container_report_file"
              else
                printf "TENANT_NULLABILITY_DIAGNOSTIC: node command produced empty report\n"
              fi
              exit "$node_status"
            ' < "$remote_script_dir/tenant-nullability-dry-run.mjs" > "$remote_tmp/report.out" 2> "$remote_tmp/transport.err"
          status=$?
          set -e
          printf 'TENANT_NULLABILITY_DIAGNOSTIC: docker command exited status=%s\n' "$status"

          if [ -s "$remote_tmp/report.out" ]; then
            cat "$remote_tmp/report.out"
          else
            printf 'TENANT_NULLABILITY_DIAGNOSTIC: container command produced no stdout\n'
          fi

          exit "$status"
          REMOTE
          status=$?
          set -e

          if grep -Eiq '://|bearer|secret|token|cookie|jwt|authorization|password|[[:alnum:]_.%+-]+@[[:alnum:].-]+' "$report_file"; then
            printf 'Tenant nullability dry-run rejected output class: unsafe pattern.\n' >&2
            printf 'Tenant nullability dry-run failed with unsafe output suppressed.\n' >&2
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
            exit "$status"
          fi

          sanitized_report=''
          sanitized_report_lines=0
          unallowlisted_output=0
          saw_docker_unavailable=0
          saw_docker_compose_unavailable=0
          saw_docker_compose_config_failed=0
          saw_api_container_unavailable=0
          saw_docker_command_starting=0
          saw_container_command_started=0
          saw_container_script_staging_failed=0
          saw_node_command_started=0
          saw_node_command_empty_report=0
          saw_container_report_cat_attempted=0
          saw_container_stdout_empty=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              "")
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: remote command started")
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: docker unavailable")
                saw_docker_unavailable=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: docker compose unavailable")
                saw_docker_compose_unavailable=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: docker compose config failed")
                saw_docker_compose_config_failed=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: api container unavailable")
                saw_api_container_unavailable=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: docker command starting")
                saw_docker_command_starting=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: container command started")
                saw_container_command_started=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: container script staging failed")
                saw_container_script_staging_failed=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: node command started")
                saw_node_command_started=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: node command produced empty report")
                saw_node_command_empty_report=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: container report cat attempted")
                saw_container_report_cat_attempted=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: container command produced no stdout")
                saw_container_stdout_empty=1
                ;;
              "TENANT_NULLABILITY_DIAGNOSTIC: node command exited status="*|"TENANT_NULLABILITY_DIAGNOSTIC: docker command exited status="*)
                if ! printf '%s\n' "$line" | grep -Eq '^TENANT_NULLABILITY_DIAGNOSTIC: (node|docker) command exited status=[0-9]+$'; then
                  unallowlisted_output=1
                fi
                ;;
              "Tenant nullability dry-run"|"Excluded models: AuditLog"|"No data changed.")
                sanitized_report="${sanitized_report}${line}"$'\n'
                sanitized_report_lines=$((sanitized_report_lines + 1))
                ;;
              *"("*"): null organization_id rows = "*)
                if printf '%s\n' "$line" | grep -Eq '^[A-Za-z]+ \([a-z_]+\): null organization_id rows = [0-9]+$'; then
                  sanitized_report="${sanitized_report}${line}"$'\n'
                  sanitized_report_lines=$((sanitized_report_lines + 1))
                else
                  printf 'Tenant nullability dry-run rejected output class: malformed count line.\n' >&2
                  printf 'Tenant nullability dry-run failed with unsafe output suppressed.\n' >&2
                  if [ "$status" -eq 0 ]; then
                    exit 1
                  fi
                  exit "$status"
                fi
                ;;
              *)
                unallowlisted_output=1
                ;;
            esac
          done < "$report_file"

          if [ "$unallowlisted_output" -ne 0 ]; then
            printf 'Tenant nullability dry-run rejected output class: unallowlisted line.\n' >&2
            printf 'Tenant nullability dry-run failed with unsafe output suppressed.\n' >&2
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
            exit "$status"
          fi

          if [ "$sanitized_report_lines" -eq 0 ]; then
            if [ "$saw_docker_unavailable" -ne 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: docker unavailable.\n' >&2
            elif [ "$saw_docker_compose_unavailable" -ne 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: docker compose unavailable.\n' >&2
            elif [ "$saw_docker_compose_config_failed" -ne 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: docker compose config failed.\n' >&2
            elif [ "$saw_api_container_unavailable" -ne 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: api container unavailable.\n' >&2
            elif [ "$saw_docker_command_starting" -ne 0 ] && [ "$saw_container_command_started" -eq 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: docker compose exec did not start container command.\n' >&2
            elif [ "$saw_container_stdout_empty" -ne 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: container command produced no stdout.\n' >&2
            elif [ "$saw_container_script_staging_failed" -ne 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: container script staging failed.\n' >&2
            elif [ "$saw_container_command_started" -ne 0 ] && [ "$saw_node_command_started" -eq 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: container command did not reach node start.\n' >&2
            elif [ "$saw_node_command_empty_report" -ne 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: node command produced empty report.\n' >&2
            elif [ "$saw_container_report_cat_attempted" -eq 0 ]; then
              printf 'Tenant nullability dry-run diagnostic class: node command exited before report output.\n' >&2
            elif [ -s "$diagnostic_file" ]; then
              printf 'Tenant nullability dry-run diagnostic class: remote command produced no report.\n' >&2
            else
              printf 'Tenant nullability dry-run diagnostic class: empty report output.\n' >&2
            fi
            printf 'Tenant nullability dry-run failed before report generation.\n' >&2
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
            exit "$status"
          fi

          if ! grep -Eq '^Tenant nullability dry-run$' "$report_file"; then
            printf 'Tenant nullability dry-run diagnostic class: report missing required header.\n' >&2
            printf 'Tenant nullability dry-run failed before report generation.\n' >&2
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
            exit "$status"
          fi

          if ! grep -Eq '^No data changed\.$' "$report_file"; then
            printf 'Tenant nullability dry-run diagnostic class: report missing completion marker.\n' >&2
            printf 'Tenant nullability dry-run failed before report generation.\n' >&2
            if [ "$status" -eq 0 ]; then
              exit 1
            fi
            exit "$status"
          fi

          printf 'TENANT_NULLABILITY_DRY_RUN_REPORT_START\n'
          printf '%s' "$sanitized_report"
          printf 'TENANT_NULLABILITY_DRY_RUN_REPORT_END\n'

          if [ "$status" -eq 0 ]; then
            printf 'PASS: tenant nullability eligible-table gate passed.\n'
          else
            printf 'FAIL: tenant nullability eligible-table gate failed.\n' >&2
          fi

          exit "$status"
