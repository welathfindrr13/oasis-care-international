name: API CI

on:
  push:
    branches:
      - main
      - demo/**
    paths:
      - 'apps/api/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db exec prisma generate

      - name: Build API package
        run: pnpm turbo run build --filter=@oasis/api

      - name: Run API tests
        run: pnpm --filter @oasis/api test
        env:
          NODE_ENV: test
