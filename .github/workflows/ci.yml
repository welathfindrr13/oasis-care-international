name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oasis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9.13.1
        
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - uses: actions/cache@v3
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - uses: actions/cache@v3
      name: Cache Prisma client
      with:
        path: libs/db/src/generated/client
        key: ${{ runner.os }}-prisma-${{ hashFiles('libs/db/prisma/schema.prisma') }}
        restore-keys: |
          ${{ runner.os }}-prisma-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Generate Prisma client
      run: pnpm --filter @oasis/db exec prisma generate
      
    - name: Run Migrations
      run: pnpm --filter @oasis/db exec prisma migrate deploy
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/oasis_test
        
    - name: Web Lint and Build
      run: |
        export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_$(printf '%s' 'synthetic-clerk.oasis.invalid$' | base64 | tr -d '\n')"
        pnpm --filter @oasis/web lint
        pnpm --filter @oasis/web build
      env:
        AUTH_IDENTITY_PROVIDER: clerk
        NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER: clerk
        NEXTAUTH_SECRET: ci-nextauth-secret
        NEXTAUTH_URL: http://localhost:3002
        
    - name: Build
      run: |
        export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_$(printf '%s' 'synthetic-clerk.oasis.invalid$' | base64 | tr -d '\n')"
        pnpm turbo run build
      env:
        AUTH_IDENTITY_PROVIDER: clerk
        NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER: clerk
        NEXTAUTH_SECRET: ci-nextauth-secret
        NEXTAUTH_URL: http://localhost:3002
      
    - name: Lint
      run: pnpm turbo run lint
      
    - name: Unit Tests
      run: pnpm turbo run test
      
    - name: E2E Tests
      run: pnpm --filter @oasis/api test:e2e
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/oasis_test
        JWT_SECRET: test-secret-key-for-oasis-testing-only
        TESTCONTAINERS_RYUK_DISABLED: true

    - name: Install Chromium for linked-carer browser journey
      run: pnpm exec playwright install --with-deps chromium

    - name: Linked-carer browser journey
      run: pnpm test:browser:linked-carer
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/oasis_test
        CI: true
        
    # - name: Upload coverage
    #   uses: codecov/codecov-action@v3
    #   if: always()
    #   with:
    #     directory: ./apps/api/coverage
    #     fail_ci_if_error: true

  deployment-v2-verification:
    name: Deployment V2 verification
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9.13.1

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Deployment V2 static gates
      shell: bash
      run: |
        set -euo pipefail
        TEMP_ENV="$(mktemp)"
        cat > "$TEMP_ENV" <<'ENV'
        NODE_ENV=production
        APP_DOMAIN=care.example.org
        ACME_EMAIL=ops@example.org
        POSTGRES_DB=oasis
        POSTGRES_USER=oasis
        POSTGRES_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        DATABASE_URL=postgresql://oasis:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@postgres:5432/oasis
        JWT_SECRET=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        SHIFT_IDEMPOTENCY_HMAC_CURRENT_KEY_ID=shift-synthetic
        SHIFT_IDEMPOTENCY_HMAC_CURRENT_SECRET=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
        SHIFT_IDEMPOTENCY_HMAC_PREVIOUS_KEYS_JSON=[]
        VISIT_COMPLETION_PROOF_ACTIVE_KEY_ID=visit-synthetic
        VISIT_COMPLETION_PROOF_ACTIVE_SECRET=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        NEXTAUTH_SECRET=0123456789abcdef0123456789abcdefnextauth
        NEXTAUTH_URL=https://care.example.org
        NEXT_PUBLIC_API_URL=https://care.example.org/graphql
        NEXT_PUBLIC_SITE_URL=https://care.example.org
        ALLOWED_ORIGINS=https://care.example.org
        AUTH_IDENTITY_PROVIDER=clerk
        CLERK_ISSUER=https://clerk.care.invalid
        CLERK_JWKS_URL=https://clerk.care.invalid/.well-known/jwks.json
        CLERK_AUDIENCE=oasis-clerk-gate-api
        CLERK_AUTHORIZED_PARTIES=https://care.example.org
        CLERK_SECRET_KEY=sk_test_synthetic_clerk_secret_32_chars_minimum
        PLATFORM_OPERATOR_CLERK_ORGANIZATION_ID=org_oasis_platform_ops
        PLATFORM_OPERATOR_CLERK_SUBJECTS=user_oasis_platform_operator
        NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER=clerk
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        NEXT_PUBLIC_CLERK_SIGN_IN_URL=https://care.example.org/sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL=https://care.example.org/sign-up
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=https://care.example.org/today
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=https://care.example.org/today
        LOCAL_AUTH_ENABLED=false
        NEXT_PUBLIC_LOCAL_AUTH_ENABLED=false
        DEMO_MODE=false
        RUN_MIGRATIONS=false
        GDPR_ENABLED=false
        METRICS_ENABLED=false
        AI_SUMMARY_ENABLED=false
        ENV
        node --test .github/workflows/ci.test.mjs
        node --test apps/web/next.config.test.js
        node --test .github/workflows/deploy-vps.test.mjs
        node --test .github/workflows/staging-tenant-migration-rehearsal.test.mjs
        node --test .github/workflows/production-tenant-migration-gate.test.mjs
        node --test .github/workflows/production-backup-restore-proof.test.mjs
        node --test .github/workflows/tenant-nullability-dry-run.test.mjs
        node --test deploy/v2/docker-compose.test.mjs
        node --test deploy/v2/scripts/verify-local.test.mjs
        node --test deploy/v2/scripts/preflight-env.test.mjs
        node --test deploy/v2/scripts/smoke-test.test.mjs
        node --test deploy/v2/scripts/backup-crypto.test.mjs
        node --test deploy/v2/scripts/backup-restore.test.mjs
        node --test deploy/v2/scripts/production-signals.test.mjs
        node --test deploy/v2/scripts/production-signal-runner.test.mjs
        node --test deploy/v2/scripts/production-signal-scheduler.test.mjs
        node deploy/v2/scripts/preflight-env.mjs "$TEMP_ENV"
        docker compose --env-file "$TEMP_ENV" -f deploy/v2/docker-compose.yml config
        docker run --rm --env-file "$TEMP_ENV" -v "$PWD/deploy/v2/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
        bash -n deploy/v2/scripts/smoke-test.sh
        bash -n deploy/v2/scripts/backup-postgres.sh
        bash -n deploy/v2/scripts/restore-postgres.sh
        bash -n deploy/v2/scripts/rehearse-backup-restore.sh
        bash -n deploy/v2/scripts/backup-restore.integration.sh
        bash -n deploy/v2/scripts/install-production-signal-scheduler.sh
        bash -n deploy/v2/scripts/verify-production-signal-scheduler.sh
        bash -n deploy/v2/scripts/verify-production-signal-systemd.sh
        bash -n deploy/v2/scripts/production-signal-installer.integration.sh
        deploy/v2/scripts/verify-production-signal-systemd.sh
        docker run --rm -v "$PWD:/source:ro" \
          ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
          bash /source/deploy/v2/scripts/production-signal-installer.integration.sh
        deploy/v2/scripts/backup-restore.integration.sh
        node --check deploy/v2/scripts/production-signals.mjs
        node --check deploy/v2/scripts/production-signal-runner.mjs
