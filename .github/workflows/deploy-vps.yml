name: Deploy VPS

on:
  workflow_dispatch:

concurrency:
  group: staging-vps-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Deployment V2 VPS
    runs-on: ubuntu-latest
    env:
      OASIS_APP_URL: https://app.oasiscare.care
    steps:
      - name: Validate deploy secrets
        shell: bash
        env:
          OASIS_VPS_HOST: ${{ secrets.OASIS_VPS_HOST }}
          OASIS_VPS_USER: ${{ secrets.OASIS_VPS_USER }}
          OASIS_VPS_SSH_KEY: ${{ secrets.OASIS_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$OASIS_VPS_HOST"
          test -n "$OASIS_VPS_USER"
          test -n "$OASIS_VPS_SSH_KEY"

      - name: Configure SSH
        shell: bash
        env:
          OASIS_VPS_HOST: ${{ secrets.OASIS_VPS_HOST }}
          OASIS_VPS_SSH_KEY: ${{ secrets.OASIS_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OASIS_VPS_SSH_KEY" > ~/.ssh/oasis_vps
          chmod 600 ~/.ssh/oasis_vps
          ssh-keyscan -H "$OASIS_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy main to VPS
        shell: bash
        env:
          OASIS_VPS_HOST: ${{ secrets.OASIS_VPS_HOST }}
          OASIS_VPS_USER: ${{ secrets.OASIS_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oasis_vps -o BatchMode=yes "$OASIS_VPS_USER@$OASIS_VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          target_class="$(tr -d '\r\n' < /etc/oasis/production-deploy-target-class 2>/dev/null || true)"
          if [ "$target_class" = "production" ]; then
            printf 'DEPLOY_TARGET_PRODUCTION\n'
          elif [ -z "$target_class" ]; then
            printf 'DEPLOY_TARGET_UNKNOWN\n' >&2
            exit 1
          else
            printf 'DEPLOY_TARGET_NOT_PRODUCTION\n' >&2
            exit 1
          fi
          cd /opt/oasis-care
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          node deploy/v2/scripts/preflight-env.mjs deploy/v2/.env
          APP_COMMIT_SHA="$(git rev-parse HEAD)"
          APP_VERSION="$(git rev-parse --short HEAD)"
          export APP_COMMIT_SHA APP_VERSION
          RUN_MIGRATIONS=false docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml up -d --build --wait --wait-timeout 180
          docker compose --env-file deploy/v2/.env -f deploy/v2/docker-compose.yml ps
          REMOTE

      - name: Verify public HTTPS endpoints
        shell: bash
        run: |
          set -euo pipefail

          probe_public_endpoint() {
            local label="$1"
            local curl_args="$2"
            local url="$3"

            for attempt in {1..30}; do
              if curl -fsS $curl_args "$url" >/dev/null; then
                printf 'PASS: %s\n' "$label"
                return 0
              fi

              printf 'WAIT: %s attempt %s/30\n' "$label" "$attempt"
              sleep 5
            done

            printf 'FAIL: %s did not become ready\n' "$label" >&2
            return 1
          }

          probe_public_endpoint "health" "" "$OASIS_APP_URL/health"
          probe_public_endpoint "ready" "" "$OASIS_APP_URL/ready"
          probe_public_endpoint "service worker" "-I" "$OASIS_APP_URL/sw.js"
