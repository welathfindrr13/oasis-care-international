name: Web Amplify Trigger

on:
  push:
    branches:
      - main
      - demo/**
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  trigger-amplify:
    name: Trigger Amplify Build
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Check webhook configuration
        id: check-webhook
        run: |
          if [ -n "${{ secrets.AMPLIFY_WEBHOOK_URL }}" ]; then
            echo "webhook_configured=true" >> $GITHUB_OUTPUT
          else
            echo "webhook_configured=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 🚀 Trigger Amplify deployment
        if: steps.check-webhook.outputs.webhook_configured == 'true'
        run: |
          echo "🔄 Triggering Amplify build for web app changes..."
          curl -X POST "${{ secrets.AMPLIFY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "message": "${{ github.event.head_commit.message }}",
              "author": "${{ github.event.head_commit.author.name }}"
            }'
          echo "✅ Amplify webhook triggered successfully"
          
      - name: 📝 Build summary
        if: steps.check-webhook.outputs.webhook_configured == 'true'
        run: |
          echo "🌐 **Amplify Build Triggered** 🌐" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.event.head_commit.author.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The Amplify build will start shortly. Check the AWS Amplify console for build progress." >> $GITHUB_STEP_SUMMARY

      - name: ℹ️ No webhook configured
        if: steps.check-webhook.outputs.webhook_configured == 'false'
        run: |
          echo "⚠️ AMPLIFY_WEBHOOK_URL secret not configured"
          echo "To enable Amplify auto-deployment:"
          echo "1. Set up AWS Amplify for the web app"
          echo "2. Get the webhook URL from Amplify console"
          echo "3. Add it as AMPLIFY_WEBHOOK_URL repository secret"
