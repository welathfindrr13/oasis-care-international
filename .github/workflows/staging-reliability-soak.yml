name: Staging Reliability Soak

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: https://app.oasis-care.co
      PLAYWRIGHT_ADMIN_EMAIL: boss@yourdomain.com
      PLAYWRIGHT_ADMIN_PASSWORD: SecurePassword123!1
      PLAYWRIGHT_CARER_EMAIL: carer-demo@yourdomain.com
      PLAYWRIGHT_CARER_PASSWORD: SecurePassword123!2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Soak preflight and execution context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/reliability

          required_files=(
            scripts/release/run-staging-reliability-suite.mjs
            scripts/release/mobile-route-smoke.mjs
            scripts/release/probes/strict_post_deploy_matrix.mjs
            scripts/release/probes/care_log_probe.mjs
            scripts/release/probes/ai_summary_probe.mjs
            scripts/release/probes/emar_provisioning_probe.mjs
          )
          for f in "${required_files[@]}"; do
            [[ -f "$f" ]] || { echo "Missing required file: $f"; exit 1; }
          done

          required_env=(
            PLAYWRIGHT_BASE_URL
            PLAYWRIGHT_ADMIN_EMAIL
            PLAYWRIGHT_ADMIN_PASSWORD
            PLAYWRIGHT_CARER_EMAIL
            PLAYWRIGHT_CARER_PASSWORD
          )
          for v in "${required_env[@]}"; do
            [[ -n "${!v:-}" ]] || { echo "Missing required env: $v"; exit 1; }
          done

          cat > test-results/reliability/_soak_context.txt <<EOF
          Staging Reliability Soak Context
          GeneratedAt=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BaseURL=${PLAYWRIGHT_BASE_URL}
          LoginURL=${PLAYWRIGHT_BASE_URL}/login
          AuthFlow=Click "Sign in securely" (Cognito Hosted UI)
          AdminUser=${PLAYWRIGHT_ADMIN_EMAIL}
          CarerUser=${PLAYWRIGHT_CARER_EMAIL}
          Probes=strict_post_deploy_matrix, care_log_probe, ai_summary_probe, emar_provisioning_probe, mobile_route_smoke
          EOF

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run reliability suite
        id: suite
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/release/run-staging-reliability-suite.mjs

      - name: Run mobile route smoke
        id: mobile
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/release/mobile-route-smoke.mjs

      - name: Collect reliability artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/reliability

          if ls -1 output/playwright/e2e-live/*_reliability_suite.json >/dev/null 2>&1; then
            latest_suite="$(ls -1t output/playwright/e2e-live/*_reliability_suite.json | head -n1)"
            cp "$latest_suite" test-results/reliability/

            node -e "
              const fs = require('fs');
              const path = require('path');
              const suitePath = process.argv[1];
              const suite = JSON.parse(fs.readFileSync(suitePath, 'utf8'));
              for (const probe of suite.probes || []) {
                if (!probe.outJson) continue;
                const src = path.resolve(probe.outJson);
                if (fs.existsSync(src)) {
                  fs.copyFileSync(src, path.resolve('test-results/reliability', path.basename(src)));
                }
              }
            " "$latest_suite"
          else
            echo "No reliability suite artifact found." > test-results/reliability/_missing_reliability_suite.txt
          fi

          if ls -1 output/playwright/e2e-live/*_mobile_route_smoke.json >/dev/null 2>&1; then
            latest_mobile_json="$(ls -1t output/playwright/e2e-live/*_mobile_route_smoke.json | head -n1)"
            cp "$latest_mobile_json" test-results/reliability/
          fi
          if ls -1 output/playwright/e2e-live/*_mobile_smoke_*.png >/dev/null 2>&1; then
            cp output/playwright/e2e-live/*_mobile_smoke_*.png test-results/reliability/
          fi

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-reliability-soak
          path: test-results/reliability

      - name: Fail workflow on gate failure
        if: steps.suite.outcome != 'success' || steps.mobile.outcome != 'success'
        shell: bash
        run: |
          echo "Reliability suite and/or mobile route smoke did not pass."
          exit 1
