name: Secret leak prevention

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  introduced-range:
    name: Scan introduced commit range
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          chmod 700 "$tool_dir"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          chmod 600 "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$tool_dir" gitleaks
          chmod 700 "$tool_dir/gitleaks"
          printf 'GITLEAKS_PATH=%s\n' "$tool_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Verify prevention workflow and pinned-scanner regressions
        run: >-
          GITLEAKS_TEST_BINARY="$GITLEAKS_PATH" node --test
          .github/workflows/secret-leak-prevention.test.mjs
          scripts/security/check-secret-range.test.mjs

      - name: Scan only commits introduced by this event
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/security/check-secret-range.mjs "$GITLEAKS_PATH" "$BASE_SHA" "$HEAD_SHA"
