name: AWS Deploy Auth Check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  EXPECTED_ACCOUNT_ID: 721689331449

jobs:
  auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate auth configuration
        id: auth_mode
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN_STAGING: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${AWS_DEPLOY_ROLE_ARN_STAGING}" ]]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Using OIDC role auth."
            exit 0
          fi
          if [[ -n "${AWS_ACCESS_KEY_ID}" && -n "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
            echo "Using static key auth."
            exit 0
          fi
          echo "mode=none" >> "$GITHUB_OUTPUT"
          echo "No deploy auth configured."
          echo "Set AWS_DEPLOY_ROLE_ARN_STAGING (preferred) or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."
          exit 1

      - name: Configure AWS credentials (OIDC role)
        if: steps.auth_mode.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: steps.auth_mode.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity and account
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity | tee /tmp/sts.json
          account="$(jq -r '.Account' /tmp/sts.json)"
          arn="$(jq -r '.Arn' /tmp/sts.json)"
          echo "Principal: $arn"
          if [[ "$account" != "${{ env.EXPECTED_ACCOUNT_ID }}" ]]; then
            echo "Wrong AWS account: $account"
            exit 1
          fi
          echo "Auth check passed for account $account"
