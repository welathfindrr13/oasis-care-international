name: Build and Push pgvector Image

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/docker/pgvector/Dockerfile'
  workflow_dispatch: # Allow manual trigger
  schedule:
    # Weekly rebuild for security patches (Sundays at 2 AM UTC)
    - cron: '0 2 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oasis-care/pgvector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=15
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ops/docker/pgvector
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Verify pgvector extension
      run: |
        docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:15 \
          bash -c "pg_ctl -D /tmp/pgdata -l /tmp/logfile start && \
                    createdb -U postgres testdb && \
                    psql -U postgres -d testdb -c 'CREATE EXTENSION vector;' && \
                    psql -U postgres -d testdb -c 'SELECT extversion FROM pg_extension WHERE extname='\''vector'\'';'"
