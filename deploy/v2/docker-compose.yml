name: oasis-care-v2

# Deployment V2 is a single-server production foundation: Caddy terminates public
# traffic, web/API stay internal, and Postgres is private to the Compose network.
# CareBridge is central to production health: later smoke tests must prove family
# users stay in family-safe surfaces and cannot access raw operational records.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
        NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER: ${NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER:?NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER is required}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}
        NEXT_PUBLIC_CLERK_CSP_ORIGINS: ${NEXT_PUBLIC_CLERK_CSP_ORIGINS:?NEXT_PUBLIC_CLERK_CSP_ORIGINS is required}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:?NEXT_PUBLIC_CLERK_SIGN_IN_URL is required}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:?NEXT_PUBLIC_CLERK_SIGN_UP_URL is required}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:?NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL is required}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:?NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL is required}
        APP_VERSION: ${APP_VERSION:-unknown}
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER: ${NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER:?NEXT_PUBLIC_AUTH_IDENTITY_PROVIDER is required}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}
      NEXT_PUBLIC_CLERK_CSP_ORIGINS: ${NEXT_PUBLIC_CLERK_CSP_ORIGINS:?NEXT_PUBLIC_CLERK_CSP_ORIGINS is required}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:?NEXT_PUBLIC_CLERK_SIGN_IN_URL is required}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:?NEXT_PUBLIC_CLERK_SIGN_UP_URL is required}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:?NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL is required}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:?NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL is required}
      APP_VERSION: ${APP_VERSION:-unknown}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required for Clerk protected routes}
      NEXT_PUBLIC_LOCAL_AUTH_ENABLED: "false"
      LOCAL_AUTH_ENABLED: "false"
      AUTH_IDENTITY_PROVIDER: ${AUTH_IDENTITY_PROVIDER:?AUTH_IDENTITY_PROVIDER is required}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SHIFT_IDEMPOTENCY_HMAC_CURRENT_KEY_ID: ${SHIFT_IDEMPOTENCY_HMAC_CURRENT_KEY_ID:?SHIFT_IDEMPOTENCY_HMAC_CURRENT_KEY_ID is required}
      SHIFT_IDEMPOTENCY_HMAC_CURRENT_SECRET: ${SHIFT_IDEMPOTENCY_HMAC_CURRENT_SECRET:?SHIFT_IDEMPOTENCY_HMAC_CURRENT_SECRET is required}
      SHIFT_IDEMPOTENCY_HMAC_PREVIOUS_KEYS_JSON: "${SHIFT_IDEMPOTENCY_HMAC_PREVIOUS_KEYS_JSON:-[]}"
      VISIT_COMPLETION_PROOF_ACTIVE_KEY_ID: ${VISIT_COMPLETION_PROOF_ACTIVE_KEY_ID:?VISIT_COMPLETION_PROOF_ACTIVE_KEY_ID is required}
      VISIT_COMPLETION_PROOF_ACTIVE_SECRET: ${VISIT_COMPLETION_PROOF_ACTIVE_SECRET:?VISIT_COMPLETION_PROOF_ACTIVE_SECRET is required}
      VISIT_COMPLETION_PROOF_PREVIOUS_KEY_ID: ${VISIT_COMPLETION_PROOF_PREVIOUS_KEY_ID:-}
      VISIT_COMPLETION_PROOF_PREVIOUS_SECRET: ${VISIT_COMPLETION_PROOF_PREVIOUS_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      AUTH_IDENTITY_PROVIDER: ${AUTH_IDENTITY_PROVIDER:?AUTH_IDENTITY_PROVIDER is required}
      LOCAL_AUTH_ENABLED: "false"
      LOCAL_AUTH_ISSUER: ${LOCAL_AUTH_ISSUER:-oasis-local-dev}
      LOCAL_AUTH_JWT_SECRET: ${LOCAL_AUTH_JWT_SECRET:-}
      CLERK_ISSUER: ${CLERK_ISSUER:?CLERK_ISSUER is required}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?CLERK_JWKS_URL is required}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?CLERK_AUTHORIZED_PARTIES is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      PLATFORM_OPERATOR_CLERK_ORGANIZATION_ID: ${PLATFORM_OPERATOR_CLERK_ORGANIZATION_ID:?PLATFORM_OPERATOR_CLERK_ORGANIZATION_ID is required}
      PLATFORM_OPERATOR_CLERK_SUBJECTS: ${PLATFORM_OPERATOR_CLERK_SUBJECTS:?PLATFORM_OPERATOR_CLERK_SUBJECTS is required}
      GDPR_ENABLED: ${GDPR_ENABLED:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-false}
      MEDICATION_EMAR_ENABLED: "false"
      APP_VERSION: ${APP_VERSION:-unknown}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
